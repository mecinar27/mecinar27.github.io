    // ================================================================
    // REKLAM SİSTEMİ (AdMob — @capacitor-community/admob)
    // HEDEF KİTLE: 13 YAŞ VE ÜZERİ — GENEL KİTLE (çocuk uygulaması DEĞİL)
    //
    // POLİTİKA YAPILANDIRMASI:
    //  1) Çocuk etiketleri KAPALI (tagForChildDirectedTreatment: false).
    //     Play Console'da hedef kitle 13+ seçilmeli, Families programına
    //     BAŞVURULMAMALI. Aksi halde beyan/uygulama uyuşmazlığı olur.
    //  2) maxAdContentRating = 'PG' — genel kitleye uygun, geniş envanter.
    //  3) AB/İngiltere/İsviçre: UMP rıza akışı zorunlu (GDPR). Rıza
    //     alınmazsa kişiselleştirilmemiş (npa) reklam gösterilir.
    //  4) Rıza gerekmeyen bölgelerde kişiselleştirilmiş reklam (daha yüksek gelir).
    //
    // KULLANICI DENEYİMİ KURALLARI (ban-güvenli, hâlâ geçerli):
    //  5) Geçiş reklamı yalnızca level ARASINDA (oyun ortasında ASLA),
    //     3 levelde bir ve en az 2 dk arayla; açılış/çıkışta reklam YOK.
    //  6) Ödüllü reklamlar her zaman kullanıcının kendi bastığı butonlarla.
    //  7) VIP üyeler hiçbir reklam görmez.
    //  8) Banner YOK — yanlış tık riskini sıfırlamak için bilinçli tercih.
    //
    // YAYINDAN ÖNCE (aksi halde ban riski):
    //  - AD_CONFIG içindeki ID'leri gerçek AdMob birim ID'leriyle değiştir.
    //  - AD_CONFIG.testing = false yap.
    //  - AndroidManifest.xml'deki APPLICATION_ID'yi gerçek App ID yap.
    //  - AdMob konsolunda GDPR mesajı (Privacy & messaging) oluştur.
    //  - Geliştirme boyunca ASLA gerçek ID kullanma / reklamına tıklama.
    // ================================================================
    var AD_CONFIG = {
        interstitial: 'ca-app-pub-3940256099942544/1033173712', // TEST interstitial
        rewarded:     'ca-app-pub-3940256099942544/5224354917', // TEST rewarded
        banner:       'ca-app-pub-3940256099942544/6300978111', // TEST banner
        testing: true // YAYINDA false YAP
    };
    var adsReady = false;
    var lastInterstitialAt = 0;
    var levelsSinceAd = 0;
    var rewardedCallback = null, rewardEarned = false;
    var usePersonalizedAds = false;      // UMP sonucuna göre belirlenir
    var privacyOptionsRequired = false;  // AB kullanıcısı: "Gizlilik seçenekleri" butonu gerekir

    function AdMobPlugin() {
        return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob) || null;
    }

    // npa = "non-personalized ads". Rıza alındıysa false (kişiselleştirilmiş),
    // alınmadıysa/gerekiyorsa true (kişiselleştirilmemiş) => GDPR uyumu.
    function npaFlag() { return !usePersonalizedAds; }

    function prepareRewarded() {
        var A = AdMobPlugin(); if (!A) return;
        A.prepareRewardVideoAd({ adId: AD_CONFIG.rewarded, isTesting: AD_CONFIG.testing, npa: npaFlag() }).catch(function(){});
    }
    function prepareInterstitial() {
        var A = AdMobPlugin(); if (!A) return;
        A.prepareInterstitial({ adId: AD_CONFIG.interstitial, isTesting: AD_CONFIG.testing, npa: npaFlag() }).catch(function(){});

    // ---- BANNER (oyun ekranının EN ALTINDA, butonların altında) ----
    // Native banner WebView'in üzerine biner. Alt buton çubuğunu örtmemesi için
    // banner yüksekliği kadar --banner-h ayrılır ve içerik yukarı itilir.
    var bannerVisible = false;
    function setBannerSpace(px) {
        document.documentElement.style.setProperty('--banner-h', (px || 0) + 'px');
    }
    function showGameBanner() {
        if (isVIP()) return;                 // VIP hiç reklam görmez
        var A = AdMobPlugin();
        if (!A || !adsReady || bannerVisible) return;
        bannerVisible = true;
        A.showBanner({
            adId: AD_CONFIG.banner,
            adSize: 'ADAPTIVE_BANNER',
            position: 'BOTTOM_CENTER',
            margin: 0,
            isTesting: AD_CONFIG.testing,
            npa: npaFlag()
        }).catch(function() { bannerVisible = false; setBannerSpace(0); });
    }
    function hideGameBanner() {
        var A = AdMobPlugin();
        bannerVisible = false;
        setBannerSpace(0);
        if (!A) return;
        A.removeBanner().catch(function(){});
    }

    // AB/İngiltere kullanıcıları için GDPR rıza akışı (Google UMP SDK)
    function runConsentFlow(A) {
        return A.requestConsentInfo().then(function(info) {
            privacyOptionsRequired = (info && info.privacyOptionsRequirementStatus === 'REQUIRED');
            // Rıza gerekiyorsa ve form varsa göster
            if (info && info.isConsentFormAvailable && info.status === 'REQUIRED') {
                return A.showConsentForm().then(function(res) {
                    usePersonalizedAds = !!(res && res.status === 'OBTAINED');
                    return res;
                }).catch(function() { usePersonalizedAds = false; });
            }
            // NOT_REQUIRED => AB dışı: kişiselleştirilmiş reklam serbest
            // OBTAINED    => rıza daha önce alınmış
            usePersonalizedAds = (info && (info.status === 'NOT_REQUIRED' || info.status === 'OBTAINED'));
            return info;
        }).catch(function() { usePersonalizedAds = false; });
    }

    // AB kullanıcısının rızasını sonradan değiştirebilmesi için (UMP zorunluluğu)
    window.showPrivacyOptions = function() {
        var A = AdMobPlugin();
        if (!A || !privacyOptionsRequired) { catSpeak(t('privacy_opts_na')); return; }
        A.showPrivacyOptionsForm().then(function() {
            return A.requestConsentInfo();
        }).then(function(info) {
            usePersonalizedAds = !!(info && (info.status === 'OBTAINED' || info.status === 'NOT_REQUIRED'));
            prepareRewarded(); prepareInterstitial();
        }).catch(function(){});
    };

    function initAds() {
        var A = AdMobPlugin();
        if (!A) return; // Web/gelistirme — simülasyon devrede
        try {
            A.initialize({
                tagForChildDirectedTreatment: false, // 13+ genel kitle
                tagForUnderAgeOfConsent: false,
                maxAdContentRating: 'PG',            // Genel kitleye uygun içerik
                initializeForTesting: AD_CONFIG.testing
            }).then(function() {
                return runConsentFlow(A); // önce rıza, sonra reklam yükle
            }).then(function() {
                adsReady = true;
                // Ödül ve kapanış olayları
                A.addListener('onRewardedVideoAdReward', function() { rewardEarned = true; });
                A.addListener('onRewardedVideoAdDismissed', function() {
                    var cb = rewardedCallback; var ok = rewardEarned;
                    rewardedCallback = null; rewardEarned = false;
                    prepareRewarded(); // sıradakini önceden yükle
                    if (ok && cb) cb();
                });
                A.addListener('interstitialAdDismissed', function() { prepareInterstitial(); });
                // Banner yüklendiğinde/boyutu değiştiğinde alt boşluğu ayarla
                A.addListener('bannerAdSizeChanged', function(size) {
                    if (bannerVisible && size && size.height) setBannerSpace(size.height);
                });
                A.addListener('bannerAdLoaded', function() {
                    // SizeChanged gelmezse standart yükseklikle güvenli boşluk bırak
                    var cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--banner-h')) || 0;
                    if (bannerVisible && cur === 0) setBannerSpace(50);
                });
                A.addListener('bannerAdFailedToLoad', function() {
                    bannerVisible = false; setBannerSpace(0); // reklam yoksa boşluk da olmasın
                });
                prepareRewarded();
                prepareInterstitial();
                if (gameStarted) showGameBanner(); // reklamlar geç hazırsa oyun içindeyken göster
            }).catch(function(){});
        } catch(e) {}
    }

        var prizes = [
            { label: L('+10 Saniye','+10 Seconds'), emoji: '⏱️', color: '#0097a7',
              action: function() { timeLeft += 10; dom.timerValueSpan.innerText = timeLeft; if (timeLeft > 5) dom.gameArea.classList.remove('critical-time'); catSpeak(L('⏱ +10 saniye bonus!','⏱ +10 seconds bonus!')); } },

            { label: L('Altın Yağmuru','Golden Rain'), emoji: '🌟', color: '#e65100',
              action: function() { for (var i = 0; i < 5; i++) { (function(d) { setTimeout(function() { spawnItem(false, false, true); }, d); })(i * 280); } catSpeak(L('🌟 Altın Yağmuru!','🌟 Golden Rain!')); } },
            { label: L('Combo Korunur','Combo Shield'), emoji: '🔥', color: '#880e4f',
              action: function() { comboProtect = true; setTimeout(function() { comboProtect = false; }, 25000); catSpeak(L('🔥 Combo 25 saniye korunuyor!','🔥 Combo protected for 25 seconds!')); } },
            { label: L('Tüm Eşyaları Topla','Collect Everything'), emoji: '💨', color: '#1b5e20',
              action: function() { var snap = itemsArray.slice(); snap.forEach(function(it) { if (it.parentNode && !it.dataset.harmful) { var r = it.getBoundingClientRect(); collectItem(it, r.left+25, r.top+25, it.innerHTML); } }); catSpeak(L('💨 Tüm eşyalar toplandı!','💨 All items collected!')); } },
            { label: L('Şansın Yok!','No Luck!'), emoji: '🎭', color: '#37474f',
              action: function() { catSpeak(L('🎭 Bu sefer şansın yok!','🎭 No luck this time!')); } }
        ];
        var n = prizes.length;
        var arc = (Math.PI * 2) / n;
        var currentRot = 0;
        var spinning = false;

        var ov = document.createElement('div');
        ov.id = 'luckyWheelOverlay';
        ov.innerHTML = '<div class="wheel-card"><h2>' + L('🎡 ŞANS ÇARKI!','🎡 LUCKY WHEEL!') + '</h2><p>' + L('Her 5 levelda bir döner — ne çıkacak?','Spins every 5 levels — what will you get?') + '</p>' +
            '<div style="position:relative;display:inline-block;margin-bottom:4px;">' +
            '<div style="position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:1.6rem;z-index:2;">▼</div>' +
            '<canvas id="wheelCanvas" width="220" height="220" style="border-radius:50%;display:block;"></canvas>' +
            '</div>' +
            '<div id="wheelResult"> </div>' +
            '<button class="wheel-spin-btn" id="wheelSpinBtn">' + L('🎡 ÇEVİR!','🎡 SPIN!') + '</button>' +
            '</div>';
        document.body.appendChild(ov);

        var canvas = document.getElementById('wheelCanvas');
        var ctx = canvas.getContext('2d');
        var CX = 110, CY = 110, R = 105;

        function drawWheel(rot) {
            ctx.clearRect(0, 0, 220, 220);
            for (var i = 0; i < n; i++) {
                var sa = rot + i * arc, ea = sa + arc;
                ctx.beginPath();
                ctx.moveTo(CX, CY);
                ctx.arc(CX, CY, R, sa, ea);
                ctx.closePath();
                ctx.fillStyle = prizes[i].color;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.25)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.save();
                ctx.translate(CX, CY);
                ctx.rotate(sa + arc / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = 'white';
                ctx.font = 'bold 9px sans-serif';
                ctx.fillText(prizes[i].emoji + ' ' + prizes[i].label, R - 8, 4);
                ctx.restore();
            }
            ctx.beginPath(); ctx.arc(CX, CY, 14, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.fill();
            ctx.beginPath(); ctx.arc(CX, CY, 11, 0, Math.PI * 2);
            ctx.fillStyle = '#ffaa44'; ctx.fill();
        }
        drawWheel(currentRot);

        document.getElementById('wheelSpinBtn').onclick = function() {
            if (spinning) return;
            spinning = true;
            this.disabled = true;
            haptic('medium');
            var totalRot = (6 + Math.random() * 6) * Math.PI * 2 + Math.random() * Math.PI * 2;
            var start = null, dur = 3800;
            function animate(ts) {
                if (!start) start = ts;
                var elapsed = ts - start, prog = Math.min(elapsed / dur, 1);
                var eased = 1 - Math.pow(1 - prog, 3);
                var rot = currentRot + totalRot * eased;
                drawWheel(rot);
                if (prog < 1) {
                    requestAnimationFrame(animate);
                } else {
                    currentRot = rot % (Math.PI * 2);
                    var normalized = ((- currentRot - Math.PI / 2) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
                    var winIdx = Math.floor(normalized / arc) % n;
                    var winner = prizes[winIdx];
                    document.getElementById('wheelResult').innerHTML = '<span style="font-size:1.3rem;">' + winner.emoji + '</span> ' + winner.label + '!';
                    haptic('heavy');
                    showScreenFlash('rgba(255,200,50,0.5)');
                    setTimeout(function() {
                        winner.action();
                        setTimeout(function() { ov.remove(); if (callback) callback(); }, 1600);
                    }, 600);
                }
            }
            requestAnimationFrame(animate);
        };
    }

    // ---- SPAWN HIZI (boss modunu, zorluğu ve modları hesaba katar) ----
    function getSpawnSpeed() {
        var theme = THEMES[currentLevel];
        var baseSpeed = isBossLevel ? Math.floor(theme.speed * 0.55) : theme.speed;
        
        // Zorluk ayarı
        var settings = difficultySettings[currentDifficulty];
        baseSpeed = Math.floor(baseSpeed / settings.speedMult);
        
        // Survival modu hız çarpanı
        if (currentGameMode === 'survival') {
            baseSpeed = Math.floor(baseSpeed / survivalSpeedMult);
        }
        
        return Math.max(200, baseSpeed); // Minimum 200ms
    }

    function haptic(type) {
        try {
            if (window.Capacitor && window.Capacitor.Plugins.Haptics) {
                var style = type === 'heavy' ? 'HEAVY' : type === 'medium' ? 'MEDIUM' : 'LIGHT';
                window.Capacitor.Plugins.Haptics.impact({ style: style });
                return;
            }
        } catch(e) {}
        try {
            var dur = type === 'heavy' ? 200 : type === 'medium' ? 100 : 50;
            if (navigator.vibrate) navigator.vibrate(dur);
        } catch(e) {}
    }

    function playWaveSound() {
        if (!soundEnabled) return;
        try {
            var ctx = getAudioCtx();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.frequency.setValueAtTime(200, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
        } catch(e) {}
    }

    function initMissionMode() {

    function updateMissionUI() {

        }).join('<span style="opacity:0.5;">→</span>');
        
        chain.innerHTML = html;

    function checkMissionItem(itemIcon) {
        if (currentGameMode !== 'mission' || currentMissionIndex >= missionChain.length) return true;
        
        if (itemIcon === missionChain[currentMissionIndex]) {
            currentMissionIndex++;
            updateMissionUI();
            if (currentMissionIndex >= missionChain.length) {
                catSpeak(L('🎉 Tüm görevler tamamlandı! Bonus!','🎉 All missions complete! Bonus!'));
                levelScore += 200;
            } else {
                catSpeak(L('✅ Görev tamamlandı! Sıradaki: ','✅ Mission complete! Next: ') + missionChain[currentMissionIndex]);
            }
            return true;

            // Yanlış eşya - ceza
            catSpeak(L('❌ Yanlış! ','❌ Wrong! ') + missionChain[currentMissionIndex] + L(' lazımdı!',' was needed!'));
            levelScore = Math.max(0, levelScore - 20);
            return false;
        }

    function initGameMode() {

            case 'survival':
                initSurvivalMode();
                break;
            case 'timeAttack':
                initTimeAttackMode();
                break;

                initNightMode();
                break;

                initReverseGravity();
                break;

    function spawnSpecialPowerUp() {

    function activatePowerUp(powerUp) {
        gameStats.powerUpsUsed++;
        saveStats();
        
        var indicator = document.getElementById('powerup-indicator');
        if (indicator) {
            indicator.innerHTML = powerUp.icon + ' ' + powerUp.name + L(' aktif!',' active!');
            indicator.classList.add('active');

            comboProtect = true;
            catSpeak(L('🛡️ Kalkan aktif! Bomba koruması!','🛡️ Shield active! Bomb protection!'));
        } else if (powerUp.id === 'multiplier') {
            scoreMultiplier = 3.0;
            catSpeak(L('✖️ 3 kat puan çarpanı aktif!','✖️ Triple score multiplier active!'));

            if (timerInterval) clearInterval(timerInterval);
            catSpeak(L('❄️ Zaman donduruldu!','❄️ Time frozen!'));

    function deactivatePowerUp(powerUp) {
        var indicator = document.getElementById('powerup-indicator');
        if (indicator) indicator.classList.remove('active');

            comboProtect = false;

        } else if (powerUp.id === 'freeze') {
            startTimerInterval();

    // ---- İSTATİSTİKLER ----
    // ---- YEDEKLEME / GERİ YÜKLEME (cihaz değişiminde ilerlemeyi koru) ----
    var BACKUP_KEYS = ['pofuduk_save','pofuduk_shop','pofuduk_stats','pofuduk_achievements','pofuduk_daily','pofuduk_leaderboard','pofuduk_stars','pofuduk_vip_expiry','pofuduk_vip_daily','pofuduk_streak_day','pofuduk_streak_last','pofuduk_starter_used','pofuduk_starter_offer_shown','pofuduk_lang','highScore'];

    function exportBackup() {
        var data = {};
        BACKUP_KEYS.forEach(function(k) { var v = localStorage.getItem(k); if (v !== null) data[k] = v; });
        try {
            // JSON -> URI-safe base64 (Türkçe/emoji karakterleri için encodeURIComponent)
            return 'POF1:' + btoa(unescape(encodeURIComponent(JSON.stringify(data))));
        } catch(e) { return ''; }
    }

    function importBackup(code) {
        if (!code || code.indexOf('POF1:') !== 0) return false;
        try {
            var json = decodeURIComponent(escape(atob(code.slice(5))));
            var data = JSON.parse(json);
            Object.keys(data).forEach(function(k) {
                if (BACKUP_KEYS.indexOf(k) !== -1) localStorage.setItem(k, data[k]);
            });
            return true;
        } catch(e) { return false; }
    }

    window.doExportBackup = function() {
        var code = exportBackup();
        var field = document.getElementById('backupField');
        if (field) { field.value = code; field.select(); }
        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(code).catch(function(){}); // izin yoksa sessizce geç (field zaten seçili)
            }
        } catch(e) {}
        catSpeak(L('📋 Yedek kodun kopyalandı! Güvenli bir yere kaydet.', '📋 Backup code copied! Save it somewhere safe.'));
    };

    window.doImportBackup = function() {
        var field = document.getElementById('backupField');
        var code = field ? field.value.trim() : '';
        if (importBackup(code)) {
            catSpeak(L('✅ İlerleme geri yüklendi! Yeniden başlatılıyor…', '✅ Progress restored! Reloading…'));
            setTimeout(function() { location.reload(); }, 1200);
        } else {
            catSpeak(L('❌ Geçersiz yedek kodu.', '❌ Invalid backup code.'));
        }
    };

    // ---- GÜNLÜK GÖREVLER ----
    var dailyQuestsData = [];
    var DAILY_QUEST_DEFS = [
        { id: 'dq_collect', name: 'Eşya Topla', nameEN: 'Collect Items', icon: '⭐', target: 80,  reward: 50 },
        { id: 'dq_combo',   name: 'Combo Yap', nameEN: 'Make Combos',  icon: '🔥', target: 10,  reward: 40 },
        { id: 'dq_levels',  name: 'Level Geç', nameEN: 'Clear Levels', icon: '🚀', target: 3,   reward: 60 }
    ];
    function questName(q) {
        var def = DAILY_QUEST_DEFS.filter(function(d){ return d.id === q.id; })[0];
        if (def && currentLang === 'en' && def.nameEN) return def.nameEN;
        return (def && def.name) || q.name;
    }
    function initDailyQuests() {
        var today = new Date().toLocaleDateString('tr-TR');
        try {
            var saved = JSON.parse(localStorage.getItem('pofuduk_daily') || '{}');
            if (saved.date === today) { dailyQuestsData = saved.quests; return; }
        } catch(e) {}
        dailyQuestsData = DAILY_QUEST_DEFS.map(function(d) {
            return { id: d.id, name: d.name, icon: d.icon, target: d.target, current: 0, reward: d.reward, completed: false };
        });
        localStorage.setItem('pofuduk_daily', JSON.stringify({ date: today, quests: dailyQuestsData }));
    }
    function saveDailyQuests() {
        var today = new Date().toLocaleDateString('tr-TR');
        localStorage.setItem('pofuduk_daily', JSON.stringify({ date: today, quests: dailyQuestsData }));
    }
    function updateDailyQuestsUI() {
        var list = document.getElementById('dailyQuestsList');
        if (!list) return;
        list.innerHTML = dailyQuestsData.map(function(q) {
            return '<div class="daily-item' + (q.completed ? ' completed' : '') + '"><span>' + q.icon + ' ' + questName(q) + (q.completed ? ' ✅' : '') + '</span><span class="daily-progress">' + Math.min(q.current, q.target) + '/' + q.target + ' (+' + q.reward + '⭐)</span></div>';
        }).join('');
    }
    function progressDailyQuest(id, amount) {
        dailyQuestsData.forEach(function(q) {
            if (q.id !== id || q.completed) return;
            q.current += amount;
            if (q.current >= q.target) {
                q.completed = true;
                totalScore += q.reward;
                if (dom.totalScoreSpan) dom.totalScoreSpan.innerText = totalScore;
                catSpeak(L('🗓️ Günlük görev tamamlandı! +','🗓️ Daily quest complete! +') + q.reward + ' ⭐');
                haptic('heavy');
            }
        });
        saveDailyQuests();
        updateDailyQuestsUI();
    }

    function calculateStars(tLeft, tLimit, questDone) {
        if (questDone && tLeft > tLimit * 0.5) return 3;
        if (questDone || tLeft > tLimit * 0.3) return 2;
        return 1;
    }
    function saveLevelStars(level, stars) {
        try {
            var arr = JSON.parse(localStorage.getItem('pofuduk_stars') || '[]');
            while (arr.length <= level) arr.push(0);
            if (stars > arr[level]) { arr[level] = stars; localStorage.setItem('pofuduk_stars', JSON.stringify(arr)); }
        } catch(e) {}
    }

        try {
            localStorage.setItem('pofuduk_save', JSON.stringify({
                currentLevel: currentLevel, totalScore: totalScore, highScore: highScore,
                unlocked: unlocked, bigPuzzle: bigPuzzle, totalPieces: totalPieces
            }));
        } catch(e) {}
    }

    function loadProgress() {
        try {
            var saved = JSON.parse(localStorage.getItem('pofuduk_save'));
            if (saved) {
                currentLevel = saved.currentLevel || 0;
                totalScore = saved.totalScore || 0;
                highScore = Math.max(saved.highScore || 0, parseInt(localStorage.getItem('highScore')) || 0);

                bigPuzzle = saved.bigPuzzle || [false, false, false, false];
                totalPieces = saved.totalPieces || 0;

            }

    function clearIntervals() {
        if (timerInterval) clearInterval(timerInterval);
        if (spawnInterval) clearInterval(spawnInterval);
        if (bonusTimeInterval) clearInterval(bonusTimeInterval);
        if (powerUpInterval) clearInterval(powerUpInterval);
        clearMoveLoop();
        if (dom.timerValueSpan) dom.timerValueSpan.classList.remove('timer-warning');
        if (dom.gameArea) dom.gameArea.classList.remove('critical-time');
    }

    function startBonusTimeInterval() {
        if (bonusTimeInterval) clearInterval(bonusTimeInterval);
        bonusTimeInterval = setInterval(spawnBonusTime, 25000);
    }

    function startTimerInterval() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(function() {
            if (!gameActive || isLevelCompleteScreen || isGameOverScreen || isPaused) return;
            timeLeft--;
            dom.timerValueSpan.innerText = timeLeft;
            if (timeLeft <= 10 && timeLeft > 0) {
                dom.timerValueSpan.classList.add('timer-warning');
                playTickSound();
            } else if (timeLeft > 10) {
                dom.timerValueSpan.classList.remove('timer-warning');
            }
            if (timeLeft <= 5 && timeLeft > 0) {
                dom.gameArea.classList.add('critical-time');
                dom.basket.classList.add('shake');
                setTimeout(function() { dom.basket.classList.remove('shake'); }, 350);
            } else if (timeLeft > 5) {
                dom.gameArea.classList.remove('critical-time');
            }
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                dom.timerValueSpan.classList.remove('timer-warning');
                // Hayatta Kalma modu: süre bitince yeni dalga — game over yok
                if (currentGameMode === 'survival') {
                    survivalWave++;
                    survivalSpeedMult = Math.min(3.5, survivalSpeedMult + 0.15);
                    updateSurvivalUI();
                    timeLeft = 30;
                    dom.timerValueSpan.innerText = timeLeft;
                    dom.gameArea.classList.remove('critical-time');
                    catSpeak(L('🌊 Dalga ','🌊 Wave ') + survivalWave + L('! Hız: ','! Speed: ') + Math.round(survivalSpeedMult * 100) + '%');
                    playWaveSound();
                    if (spawnInterval) clearInterval(spawnInterval);
                    spawnInterval = setInterval(createItem, getSpawnSpeed());
                    startTimerInterval();
                    return;
                }
                showGameOverPopup();
                gameActive = false;
            }
        }, 1000);
    }
    
    function updateUI() {

        dom.levelBadge.innerText = 'Sv.' + theme.id;

        dom.highScoreSpan.innerText = highScore;

    function addPoints(amount, icon, x, y) {
        var base = amount;
        if (activeBuffs.double) base *= 2;
        if (activeBuffs.magnet) base += 1;
        if (isVIP()) base *= 2; // VIP 2× puan bonusu
        var final = Math.round(base * scoreMultiplier); // Streak çarpanı sadece totalScore'u etkiler
        totalScore += final;
        levelScore += base;  // Level bar streak'ten bağımsız, gerçek toplama sayısı
        updateCatCostume();
        if (totalScore > highScore) { highScore = totalScore; localStorage.setItem('highScore', highScore); }
        if (!currentQuest.completed && icon === currentQuest.requiredIcon) {
            currentQuest.current += base; // quest de streak'ten bağımsız
            if (currentQuest.current >= currentQuest.target) {
                currentQuest.completed = true;
                totalScore += currentQuest.reward;
                catSpeak(L('Görev tamamlandı! +' + currentQuest.reward + ' yıldız!', 'Quest complete! +' + currentQuest.reward + ' stars!'));
            }
        }
        updateUI();

        var floatDiv = document.createElement('div');
        floatDiv.className = 'float-number';
        // Streak aktifse çarpan etiketini göster
        var multiplierTag = scoreMultiplier > 1 ? ' x' + scoreMultiplier.toFixed(1) : '';
        floatDiv.innerText = '+' + final + multiplierTag + ' ' + icon;
        floatDiv.style.left = x + 'px';
        floatDiv.style.top = y + 'px';
        document.body.appendChild(floatDiv);
        setTimeout(function() { floatDiv.remove(); }, 1000);
        
        if (!unlocked.double && totalScore >= 100) { unlocked.double = true; updateSkillsUI(); catSpeakWithVoice(L('Tebrikler! Çift yıldız kazandın!', 'Congrats! You unlocked Double Star!')); }
        if (!unlocked.time && totalScore >= 300) { unlocked.time = true; updateSkillsUI(); catSpeakWithVoice(L('Harika! Zaman ekleyebilirsin!', 'Great! You can add time now!')); }
        if (!unlocked.magnet && totalScore >= 600) { unlocked.magnet = true; updateSkillsUI(); catSpeakWithVoice(L('Mükemmel! Mıknatıs gücü senin!', 'Perfect! The Magnet power is yours!')); }
        if (!unlocked.auto && totalScore >= 1000) { unlocked.auto = true; updateSkillsUI(); catSpeakWithVoice(L('İnanılmaz! Otomatik toplayıcı açıldı!', 'Incredible! Auto-collector unlocked!')); }
        
        if (levelScore >= THEMES[currentLevel].target && gameActive && !isLevelCompleteScreen) {
            showLevelCompletePopup();
            gameActive = false;
        }
    }
    
    function showComboPopup(c) {
        var popup = document.getElementById('combo-popup');
        if (!popup) return;
        var labels = { 5: '5 COMBO! 🔥', 10: '10 COMBO! ⚡', 15: '15 COMBO! 💥', 20: '20 COMBO! 🌟', 30: '30 COMBO! 👑' };
        var label = labels[c] || (c + ' COMBO! 🔥');
        popup.innerText = label;
        popup.style.opacity = '1';
        popup.style.transform = 'translate(-50%, -50%) scale(1.3)';
        clearTimeout(popup._t);
        popup._t = setTimeout(function() {
            popup.style.opacity = '0';
            popup.style.transform = 'translate(-50%, -50%) scale(1)';
        }, 900);
    }

    function updateCombo() {
        if (comboTimer) clearTimeout(comboTimer);
        combo++;
        dom.comboValueSpan.innerText = combo;
        if (combo >= 5) triggerComboFlash(combo);
        if (combo === 5) { catSpeakWithVoice(L('Beş kombo! Harika!', 'Five combo! Great!')); showComboPopup(5); }
        else if (combo === 10) { catSpeakWithVoice(L('On kombo! Süper!', 'Ten combo! Super!')); showComboPopup(10); }
        else if (combo === 15) { showComboPopup(15); }
        else if (combo === 20) { catSpeakWithVoice(L('Yirmi kombo! Efsane!', 'Twenty combo! Legendary!')); showComboPopup(20); }
        else if (combo === 30) { catSpeakWithVoice(L('Otuz kombo! Durdurulamazsın!', 'Thirty combo! Unstoppable!')); showComboPopup(30); }
        progressDailyQuest('dq_combo', 1);
        if (!comboProtect) {
            comboTimer = setTimeout(function() { combo = 0; dom.comboValueSpan.innerText = 0; }, 2000);
        }

    function removeItem(el) {
        el.remove();
        itemsArray = itemsArray.filter(function(i) { return i !== el; });
    }

    function collectItem(el, clientX, clientY, itemIcon) {
        if (!gameActive || isLevelCompleteScreen || isGameOverScreen || isPaused) return;
        if (el.dataset.collected) return; // kaybolma animasyonu sırasında tekrar tıklamayı engelle
        el.dataset.collected = '1';

        // Bonus süre eşyası
        if (el.dataset.bonusTime) {
            timeLeft += 5;
            dom.timerValueSpan.innerText = timeLeft;
            if (timeLeft > 10) dom.timerValueSpan.classList.remove('timer-warning');
            var bf = document.createElement('div');
            bf.className = 'float-number';
            bf.innerText = '+5 ⏰';
            bf.style.cssText = 'left:' + clientX + 'px;top:' + clientY + 'px;color:#00e5ff;';
            document.body.appendChild(bf);
            setTimeout(function() { bf.remove(); }, 1000);
            catSpeak(L('⏰ +5 saniye bonus!', '⏰ +5 seconds bonus!'));
            haptic('light');
            el.classList.add('caught');
            setTimeout(function() { removeItem(el); }, 400);
            return;
        }

        // Altın eşya
        if (el.dataset.golden) {
            var goldPts = Math.round(5 * scoreMultiplier);
            totalScore += goldPts; levelScore += goldPts;
            if (totalScore > highScore) { highScore = totalScore; localStorage.setItem('highScore', highScore); }
            updateUI(); updateCatCostume();
            showScreenFlash('rgba(255,210,0,0.72)');
            burstParticles(clientX, clientY, itemIcon, '#ffd700', 10);
            var gf = document.createElement('div');
            gf.className = 'float-number';
            gf.innerText = '+' + goldPts + ' ✨ ALTIN!';
            gf.style.cssText = 'left:' + (clientX - 45) + 'px;top:' + (clientY - 10) + 'px;color:#ffd700;font-size:1.7rem;text-shadow:0 0 12px #ff8800;';
            document.body.appendChild(gf);
            setTimeout(function() { gf.remove(); }, 1500);
            haptic('heavy');
            catSpeak(L('🌟 ALTIN EŞYA! +' + goldPts + ' puan!', '🌟 GOLDEN ITEM! +' + goldPts + ' points!'));
            el.classList.add('caught');
            setTimeout(function() { removeItem(el); }, 500);
            return;
        }

        // Power-up eşyası
        if (el.dataset.powerUp) {
            var puId = el.dataset.powerUp;
            var puDef = POWER_UP_TYPES.filter(function(p) { return p.id === puId; })[0];
            var pf = document.createElement('div');
            pf.className = 'float-number';
            pf.innerText = puDef ? puDef.label : '⚡ Güç!';
            pf.style.cssText = 'left:' + clientX + 'px;top:' + clientY + 'px;color:' + (puDef ? puDef.color : '#fff') + ';font-size:1.2rem;';
            document.body.appendChild(pf);
            setTimeout(function() { pf.remove(); }, 1200);
            haptic('heavy');
            el.classList.add('caught');
            setTimeout(function() { removeItem(el); }, 400);
            if (puId === 'magnet') {
                activeBuffs.magnet = true;
                catSpeak(L('🧲 Mıknatıs aktif! 8 saniye!', '🧲 Magnet active! 8 seconds!'));
                clearTimeout(buffTimers.magnet);
                buffTimers.magnet = setTimeout(function() { activeBuffs.magnet = false; catSpeak(L('Mıknatıs sona erdi.', 'Magnet ended.')); }, 8000);
            } else if (puId === 'slow') {
                itemsArray.forEach(function(i) {
                    if (i.dataset.vx) i.dataset.vx = (parseFloat(i.dataset.vx) * 0.3).toFixed(3);
                    if (i.dataset.vy) i.dataset.vy = (parseFloat(i.dataset.vy) * 0.3).toFixed(3);
                });
                catSpeak(L('⏩ Eşyalar yavaşladı! 8 saniye!', '⏩ Items slowed! 8 seconds!'));
                setTimeout(function() {
                    itemsArray.forEach(function(i) {
                        var vx = parseFloat(i.dataset.vx) || 0;
                        var vy = parseFloat(i.dataset.vy) || 0;
                        if (Math.abs(vx) < 0.15) i.dataset.vx = ((vx < 0 ? -1 : 1) * (0.3 + Math.random() * 0.4)).toFixed(3);
                        if (Math.abs(vy) < 0.15) i.dataset.vy = ((vy < 0 ? -1 : 1) * (0.2 + Math.random() * 0.3)).toFixed(3);
                    });
                    catSpeak(L('Eşyalar normal hıza döndü.', 'Items back to normal speed.'));
                }, 8000);
            } else if (puId === 'double') {
                activeBuffs.double = true;
                catSpeak(L('💎 2 kat puan aktif! 8 saniye!', '💎 Double points active! 8 seconds!'));
                clearTimeout(buffTimers.double);
                buffTimers.double = setTimeout(function() { activeBuffs.double = false; catSpeak(L('2 kat puan sona erdi.', 'Double points ended.')); }, 8000);
            }
            return;
        }

        // Zararlı eşya
        if (el.dataset.harmful) {
            totalScore = Math.max(0, totalScore - 3);
            levelScore = Math.max(0, levelScore - 3);
            dom.totalScoreSpan.innerText = totalScore;
            var hf = document.createElement('div');
            hf.className = 'float-number';
            hf.innerText = '-3 ' + itemIcon;
            hf.style.cssText = 'left:' + clientX + 'px;top:' + clientY + 'px;color:#ff4444;';
            document.body.appendChild(hf);
            setTimeout(function() { hf.remove(); }, 1000);
            haptic('medium');
            dom.basket.style.boxShadow = '0 0 20px red';
            setTimeout(function() { dom.basket.style.boxShadow = ''; }, 400);
            el.classList.add('caught');
            setTimeout(function() { removeItem(el); }, 400);
            return;
        }

        var points = 1;
        if (activeBuffs.double) points *= 2;
        if (activeBuffs.magnet) points += 1;
        addPoints(points, itemIcon, clientX, clientY);
        updateCombo();
        playPop(combo);
        haptic('light');
        progressDailyQuest('dq_collect', points);
        checkAchievements();
        burstParticles(clientX, clientY, itemIcon, '#ffd700', 5);

        dom.basket.classList.add('basket-catch');
        setTimeout(function() { dom.basket.classList.remove('basket-catch'); }, 150);

        el.classList.add('caught');
        setTimeout(function() { removeItem(el); }, 500);
    }

    function spawnItem(isHarmful, isBonusTime, isGolden) {
        if (!gameActive || isLevelCompleteScreen || isGameOverScreen || isPaused) return;
        var areaRect = dom.gameArea.getBoundingClientRect();
        if (areaRect.width === 0) return;
        var theme = THEMES[currentLevel];

        var icon, item = document.createElement('div');
        item.id = 'item' + itemId++;

        if (isGolden) {
            icon = GOLDEN_ICONS[Math.floor(Math.random() * GOLDEN_ICONS.length)];
            item.className = 'floating-item golden';
            item.dataset.golden = 'true';
        } else if (isBonusTime) {
            icon = '⏰';
            item.className = 'floating-item bonus-time';
            item.dataset.bonusTime = 'true';
        } else if (isHarmful) {
            icon = BOMB_ICONS[Math.floor(Math.random() * BOMB_ICONS.length)];
            item.className = 'floating-item harmful';
            item.dataset.harmful = 'true';
        } else {
            icon = Math.random() < 0.45 && !currentQuest.completed ? currentQuest.requiredIcon : theme.items[Math.floor(Math.random() * theme.items.length)];
            item.className = 'floating-item';
        }
        item.innerHTML = icon;

        var startX = Math.random() * (areaRect.width - 80) + 15;
        var startY = Math.random() * (areaRect.height - 150) + 20;
        item.style.left = startX + 'px';
        item.style.top  = startY + 'px';

        // Hareket hızı ve tipi
        var speed = 0.3 + Math.random() * 0.6;
        item.dataset.vx = ((Math.random() < 0.5 ? 1 : -1) * speed).toFixed(3);
        item.dataset.vy = ((Math.random() < 0.5 ? 1 : -1) * speed * 0.7).toFixed(3);
        item.dataset.px = startX.toFixed(1);
        item.dataset.py = startY.toFixed(1);

        if (!isGolden && !isBonusTime && !isHarmful) {
            if (currentLevel >= 25 && Math.random() < 0.35) {
                item.dataset.moveType = 'orbit';
                item.dataset.centerX = startX.toFixed(1);
                item.dataset.centerY = startY.toFixed(1);
                item.dataset.orbitR = (22 + Math.random() * 38).toFixed(1);
                item.dataset.angle = (Math.random() * Math.PI * 2).toFixed(3);
                item.dataset.orbitSpeed = ((Math.random() * 0.025 + 0.015) * (Math.random() < 0.5 ? 1 : -1)).toFixed(4);
            } else if (currentLevel >= 15 && Math.random() < 0.45) {
                item.dataset.moveType = 'zigzag';
                item.dataset.zigzagT = (Math.random() * Math.PI * 2).toFixed(3);
            } else {
                item.dataset.moveType = 'linear';
            }
        } else {
            item.dataset.moveType = 'linear';
        }

        item.onclick = function(e) {
            e.stopPropagation();
            var rect = item.getBoundingClientRect();
            collectItem(item, rect.left + 25, rect.top + 25, icon);
        };
        item.draggable = true;
        item.ondragstart = function(e) { e.dataTransfer.setData('text/plain', item.id); };
        dom.gameArea.appendChild(item);
        itemsArray.push(item);

        if (!isBonusTime && !isHarmful && activeBuffs.auto) {
            setTimeout(function() {
                if (item.parentNode && gameActive && !isPaused) {
                    var rect = item.getBoundingClientRect();
                    collectItem(item, rect.left + 25, rect.top + 25, icon);
                }
            }, 200);
        }
        var lifetime = isBonusTime ? 6000 : 4500;
        setTimeout(function() {
            if (item.parentNode) {
                item.classList.add('fading');

    function moveItemsLoop() {
        if (moveRAF) cancelAnimationFrame(moveRAF);
        var area = dom.gameArea;
        function tick() {
            if (!gameActive || isPaused) { moveRAF = requestAnimationFrame(tick); return; }
            var aW = area.offsetWidth - 60, aH = area.offsetHeight - 60;
            itemsArray.forEach(function(item) {
                if (!item.parentNode || item.dataset.bonusTime || item.classList.contains('caught')) return;
                var vx = parseFloat(item.dataset.vx) || 0;
                var vy = parseFloat(item.dataset.vy) || 0;
                var mt = item.dataset.moveType || 'linear';
                
                // Rüzgarlı mod - yatay hareket ekle
                if (currentGameMode === 'wind' && windDirection !== 0 && mt === 'linear') {
                    vx = (vx || 0) + windDirection * windStrength * 2;
                }

                if (mt === 'orbit') {
                    var cx = parseFloat(item.dataset.centerX) || 0;
                    var cy = parseFloat(item.dataset.centerY) || 0;
                    var r  = parseFloat(item.dataset.orbitR) || 30;
                    var ag = parseFloat(item.dataset.angle) || 0;
                    var os = parseFloat(item.dataset.orbitSpeed) || 0.02;
                    cx += vx; cy += vy;
                    if (cx - r < 10)  { cx = 10 + r;  item.dataset.vx = Math.abs(vx).toFixed(3); }
                    if (cx + r > aW)  { cx = aW - r;  item.dataset.vx = (-Math.abs(vx)).toFixed(3); }
                    if (cy - r < 10)  { cy = 10 + r;  item.dataset.vy = Math.abs(vy).toFixed(3); }
                    if (cy + r > aH)  { cy = aH - r;  item.dataset.vy = (-Math.abs(vy)).toFixed(3); }
                    ag += os;
                    var px = cx + Math.cos(ag) * r;
                    var py = cy + Math.sin(ag) * r;
                    item.dataset.centerX = cx.toFixed(1); item.dataset.centerY = cy.toFixed(1);
                    item.dataset.angle = ag.toFixed(3);
                    item.dataset.px = px.toFixed(1); item.dataset.py = py.toFixed(1);
                    item.style.left = px + 'px'; item.style.top = py + 'px';

                } else if (mt === 'zigzag') {
                    var t  = parseFloat(item.dataset.zigzagT) + 0.09;
                    var px = parseFloat(item.dataset.px) || parseFloat(item.style.left);
                    var py = parseFloat(item.dataset.py) || parseFloat(item.style.top);
                    // Ters yerçekimi: yukarı ivme ekle
                    if (reverseGravityActive) {
                        vy = Math.max(vy - 0.025, -2.0);
                        item.dataset.vy = vy.toFixed(3);
                    }
                    px += vx;
                    py += vy + Math.sin(t) * 2.4;
                    if (px < 10)  { px = 10;  item.dataset.vx = Math.abs(vx).toFixed(3); }
                    if (px > aW)  { px = aW;  item.dataset.vx = (-Math.abs(vx)).toFixed(3); }
                    if (py < 10)  { py = 10;  item.dataset.vy = Math.abs(vy).toFixed(3); }
                    if (py > aH)  { py = aH;  item.dataset.vy = (-Math.abs(vy)).toFixed(3); }
                    item.dataset.zigzagT = t.toFixed(3);
                    item.dataset.px = px.toFixed(1); item.dataset.py = py.toFixed(1);
                    item.style.left = px + 'px'; item.style.top = py + 'px';

                } else {
                    var px = parseFloat(item.dataset.px) || parseFloat(item.style.left);
                    var py = parseFloat(item.dataset.py) || parseFloat(item.style.top);
                    // Ters yerçekimi: yukarı ivme ekle
                    if (reverseGravityActive) {
                        vy = Math.max(vy - 0.025, -2.0);
                        item.dataset.vy = vy.toFixed(3);
                    }
                    px += vx; py += vy;
                    if (px < 10)  { px = 10;  item.dataset.vx = Math.abs(vx).toFixed(3); }
                    if (px > aW)  { px = aW;  item.dataset.vx = (-Math.abs(vx)).toFixed(3); }
                    if (py < 10)  { py = 10;  item.dataset.vy = Math.abs(vy).toFixed(3); }
                    if (py > aH)  { py = aH;  item.dataset.vy = (-Math.abs(vy)).toFixed(3); }
                    item.dataset.px = px.toFixed(1); item.dataset.py = py.toFixed(1);
                    item.style.left = px + 'px'; item.style.top = py + 'px';
                }
            });
            moveRAF = requestAnimationFrame(tick);
        }
        tick();
    }

                '<div style="display:flex;gap:10px;">' +
                '<button id="briefingExitNo" style="flex:1;background:#4caf50;color:white;border:none;padding:12px;border-radius:14px;font-weight:bold;font-size:0.95rem;cursor:pointer;">' + t('no') + '</button>' +
                '<button id="briefingExitYes" style="flex:1;background:#e74c3c;color:white;border:none;padding:12px;border-radius:14px;font-weight:bold;font-size:0.95rem;cursor:pointer;">' + t('yes') + '</button>' +
                '</div></div>';
            document.body.appendChild(confirmOv);
            document.getElementById('briefingExitNo').onclick = function() { confirmOv.remove(); };
            document.getElementById('briefingExitYes').onclick = function() {
                confirmOv.remove();
                ov.remove();
                clearIntervals();
                itemsArray.forEach(function(i) { i.remove(); });
                itemsArray = [];
                removeBossModeUI();
                document.getElementById('gameContainer').style.display = 'none';
                var splash = document.getElementById('splashScreen');
                splash.style.display = 'flex';
                splash.classList.remove('hiding');
                splash.style.opacity = '';
                splash.style.transform = '';
                gameStarted = false; gameActive = false;
                hideGameBanner();
            };
        };
    }

    function applyBossModeUI() {
        dom.gameArea.classList.add('boss-mode');
        if (!document.getElementById('bossBadge')) {
            var bb = document.createElement('div');
            bb.className = 'boss-badge'; bb.id = 'bossBadge';
            bb.innerHTML = '👹 BOSS LEVEL!';
            dom.gameArea.appendChild(bb);
        }
        startBossMusic();
    }
    function removeBossModeUI() {
        dom.gameArea.classList.remove('boss-mode');
        var bb = document.getElementById('bossBadge');
        if (bb) bb.remove();
    }

    function nextLevel() {
        if (currentLevel + 1 >= THEMES.length) { catSpeak(L('TÜM DÜNYALARI GEZDİN!', 'YOU VISITED ALL WORLDS!')); return; }
        cleanupGameMode(); // Önceki mod efektlerini temizle
        maybeShowInterstitial(); // VIP olmayanlara, 3 levelde bir, frekans sınırlı
        currentLevel++;
        var theme = THEMES[currentLevel];
        isBossLevel = (currentLevel === 9 || currentLevel === 19 || currentLevel === 29 || currentLevel === 39);
        levelScore = 0;
        timeLeft = getLevelTime(theme);
        dom.timerValueSpan.innerText = timeLeft;
        currentQuest = { target: 12 + Math.floor(currentLevel / 2), current: 0, completed: false, reward: 80 + currentLevel * 3, requiredIcon: theme.icon };
        updateUI();
        updateSkillsUI();
        checkBigPuzzle();
        setGameBackground(currentLevel);
        saveProgress();
        progressDailyQuest('dq_levels', 1);
        checkAchievements();
        // 4. dünyaya (currentLevel===3) geçerken oyuncu ısınmıştır — başlangıç teklifini göster
        var proceedToBriefing = function() {
        showLevelBriefing(currentLevel, function() {
            gameActive = true;
            isPaused = false;
            dom.pauseResumeBtn.innerText = t('pause');
            if (isBossLevel) applyBossModeUI(); else removeBossModeUI();
            if (spawnInterval) clearInterval(spawnInterval);
            spawnInterval = setInterval(createItem, getSpawnSpeed());
            startTimerInterval();
            startBonusTimeInterval();
            startPowerUpInterval();
            moveItemsLoop();
            initGameMode(); // Her level geçişinde modu yeniden başlat
            catSpeakWithVoice(isBossLevel ? L('👹 BOSS LEVEL! Hazır ol!','👹 BOSS LEVEL! Get ready!') : L('Yeni dünya ' + themeName(theme) + '! Hedef ' + theme.target + ' nesne!', 'New world ' + themeName(theme) + '! Target ' + theme.target + ' items!'));
        });
        };
        if (currentLevel === 3) { maybeShowStarterOffer(proceedToBriefing); }
        else { proceedToBriefing(); }
    }

    function restartCurrentLevel() {
        clearIntervals();
        cleanupGameMode(); // Önceki mod efektlerini temizle
        vipContinueUsed = false; // yeni deneme — VIP devam hakkı yenilenir
        isBossLevel = (currentLevel === 9 || currentLevel === 19 || currentLevel === 29 || currentLevel === 39);
        if (isBossLevel) applyBossModeUI(); else { removeBossModeUI(); startGameMusic(); }
        setGameBackground(currentLevel);
        itemsArray.forEach(function(i) { i.remove(); });
        itemsArray = [];
        var theme = THEMES[currentLevel];
        levelScore = 0;
        timeLeft = getLevelTime(theme);
        dom.timerValueSpan.innerText = timeLeft;
        currentQuest.current = 0;
        currentQuest.completed = false;
        isLevelCompleteScreen = false;
        isGameOverScreen = false;
        updateUI();
        showLevelBriefing(currentLevel, function() {
            gameActive = true;
            isPaused = false;
            dom.pauseResumeBtn.innerText = t('pause');
            if (spawnInterval) clearInterval(spawnInterval);
            spawnInterval = setInterval(createItem, getSpawnSpeed());
            startTimerInterval();
            startBonusTimeInterval();
            startPowerUpInterval();
            moveItemsLoop();
            initGameMode(); // Modu yeniden başlat
            catSpeak(L('Yeniden başlıyor!', 'Restarting!'));
        });
    }

    function fullReset() {
        clearIntervals();
        cleanupGameMode(); // Aktif mod efektlerini temizle
        vipContinueUsed = false; // yeni oyun — VIP devam hakkı yenilenir
        startGameMusic();
        setGameBackground(0);
        itemsArray.forEach(function(i) { i.remove(); });
        itemsArray = [];
        currentLevel = 0;
        totalScore = 0;
        levelScore = 0;
        combo = 0;
        dom.comboValueSpan.innerText = 0;
        bigPuzzle = [false, false, false, false];
        totalPieces = 0;
        unlocked = { double: false, time: false, magnet: false, auto: false };
        activeBuffs = {};
        skillCooldown = {};
        var theme = THEMES[0];
        timeLeft = getLevelTime(theme);
        currentQuest = { target: 15, current: 0, completed: false, reward: 80, requiredIcon: theme.icon };
        isLevelCompleteScreen = false;
        isGameOverScreen = false;
        isBossLevel = false;
        levelStreak = 0;
        scoreMultiplier = 1.0;
        removeBossModeUI();
        updateUI();
        updateSkillsUI();
        updateStreakUI();
        showLevelBriefing(0, function() {
            gameActive = true;
            isPaused = false;
            dom.pauseResumeBtn.innerText = t('pause');
            if (spawnInterval) clearInterval(spawnInterval);
            spawnInterval = setInterval(createItem, getSpawnSpeed());
            startTimerInterval();
            startBonusTimeInterval();
            startPowerUpInterval();
            moveItemsLoop();
            saveProgress();
            catSpeak(L('Macera baştan başlıyor!', 'Adventure starts over!'));
        });
    }

    function togglePause() {
        if (!gameStarted || gameActive === false || isLevelCompleteScreen || isGameOverScreen) return;
        isPaused = !isPaused;
        dom.pauseResumeBtn.innerText = isPaused ? t('resume') : t('pause');
        if (isPaused) {
            if (spawnInterval) clearInterval(spawnInterval);
            if (timerInterval) clearInterval(timerInterval);
            catSpeak(L('Oyun durduruldu.', 'Game paused.'));
            dom.gameArea.style.filter = 'blur(3px) brightness(0.7)';
        } else {
            spawnInterval = setInterval(createItem, getSpawnSpeed());
            startTimerInterval();
            startBonusTimeInterval();
            startPowerUpInterval();
            moveItemsLoop();
            catSpeak(L('Oyun devam ediyor!', 'Game resumed!'));
            dom.gameArea.style.filter = '';
        }
    }

    function setupDragDrop() {
        dom.basket.addEventListener('dragover', function(e) { e.preventDefault(); });
        dom.basket.addEventListener('drop', function(e) {
            e.preventDefault();
            var id = e.dataTransfer.getData('text/plain');
            var dragged = document.getElementById(id);
            if (dragged && dragged.parentNode && gameActive && !isLevelCompleteScreen && !isGameOverScreen && !isPaused) {
                var rect = dragged.getBoundingClientRect();
                collectItem(dragged, rect.left + 25, rect.top + 25, dragged.innerHTML);
            }
        });

        // Parmakla sepet sürükleme
        var basketDragging = false;
        dom.basket.addEventListener('touchstart', function(e) {
            basketDragging = true;
            e.preventDefault();
        }, { passive: false });
        document.addEventListener('touchmove', function(e) {
            if (!basketDragging) return;
            var touch = e.touches[0];
            var areaRect = dom.gameArea.getBoundingClientRect();
            var x = touch.clientX - areaRect.left;
            var halfW = dom.basket.offsetWidth / 2;
            var clamped = Math.max(halfW, Math.min(areaRect.width - halfW, x));
            dom.basket.style.left = clamped + 'px';
            dom.basket.style.transform = 'translateX(-50%)';
            e.preventDefault();
        }, { passive: false });
        document.addEventListener('touchend', function() { basketDragging = false; });
    }

    function startGame(fromSave) {
        var splash = document.getElementById('splashScreen');
        splash.classList.add('hiding');
        if (window._stopSplashCanvas) window._stopSplashCanvas();
        setTimeout(function() { splash.style.display = 'none'; }, 550);
        document.getElementById('gameContainer').style.display = 'flex';
        setTimeout(initThreeJS, 100);

        if (fromSave && loadProgress()) {
            // Kayıtlı oyunu yükle
            var theme = THEMES[currentLevel];
            timeLeft = getLevelTime(theme);
            currentQuest = { target: 12 + Math.floor(currentLevel / 2), current: 0, completed: false, reward: 80 + currentLevel * 3, requiredIcon: theme.icon };
            if (currentLevel === 0) currentQuest.target = 15;
            dom.timerValueSpan.innerText = timeLeft;
            dom.highScoreSpan.innerText = highScore;
            updateUI(); updateSkillsUI();
            setGameBackground(currentLevel); startGameMusic();
            catSpeakWithVoice(L('Hoş geldin! Level ' + (currentLevel + 1) + '\'den devam ediyoruz!', 'Welcome back! Continuing from level ' + (currentLevel + 1) + '!'));
        } else {
            highScore = localStorage.getItem('highScore') ? parseInt(localStorage.getItem('highScore')) : 0;
            dom.highScoreSpan.innerText = highScore;
            var theme = THEMES[0];
            timeLeft = getLevelTime(theme);
            dom.timerValueSpan.innerText = timeLeft;
            currentQuest = { target: 15, current: 0, completed: false, reward: 80, requiredIcon: theme.icon };
            updateUI(); updateSkillsUI();
            setGameBackground(0); startGameMusic();
        }

        updateVIPUI();
        updateStarUI();
        claimDailyVIPStars();
        initDailyQuests();
        updateDailyQuestsUI();
        updateCatCostume();
        isBossLevel = (currentLevel === 9 || currentLevel === 19 || currentLevel === 29 || currentLevel === 39);
        if (isBossLevel) applyBossModeUI(); else removeBossModeUI();
        showLevelBriefing(currentLevel, function() {
            showCountdown(function() {
                gameActive = true;   // Önceki oyundan false kalmış olabilir — mutlaka sıfırla
                isPaused = false;
                isLevelCompleteScreen = false;
                isGameOverScreen = false;
                if (spawnInterval) clearInterval(spawnInterval);
                spawnInterval = setInterval(createItem, getSpawnSpeed());
                startTimerInterval();
                startBonusTimeInterval();
                startPowerUpInterval();
                moveItemsLoop();
                gameStarted = true;
                initGameMode(); // Oyun modunu başlat
                showGameBanner(); // banner en altta, buton çubuğunun altında
                if (!fromSave) catSpeakWithVoice(currentGameMode !== 'classic' ? ('🎮 ' + modeLabel(currentGameMode)) : L('Tur başladı. Kombo zincirini kurma zamanı.', 'Run started. Time to build your combo chain.'));
                maybeShowTutorial(); // ilk oyunda kısa rehber
            });
        });
    }

    // Splash ekranında kayıt varsa "Devam Et" butonunu göster
    if (hasSaveData()) {
        var continueBtn = document.getElementById('continueGameBtn');
        if (continueBtn) continueBtn.style.display = 'block';
    }

    document.getElementById('startGameBtn').onclick = function() { unlockAudio(); startGame(false); };
    document.getElementById('continueGameBtn').onclick = function() { unlockAudio(); startGame(true); };
    
    // Oyundan çıkış onayı (ayarlar panelinden çağrılır)
    window.confirmExitToMenu = function() {
        var wasPlaying = gameStarted && gameActive && !isPaused && !isLevelCompleteScreen && !isGameOverScreen;
        if (wasPlaying) { isPaused = true; if (spawnInterval) clearInterval(spawnInterval); if (timerInterval) clearInterval(timerInterval); }

        var ov = document.createElement('div');
        ov.id = 'exitOverlay';
        ov.className = 'purchase-confirm-overlay';
        ov.style.zIndex = '9999';
        ov.innerHTML =
            '<div class="purchase-confirm-card">' +
                '<div style="font-size:1rem;font-weight:600;color:var(--text);margin-bottom:18px;">' + t('exit_q') + '</div>' +
                '<div style="display:flex;gap:10px;">' +
                    '<button id="exitNo" style="flex:1;background:var(--surface-2);border:1px solid var(--border-2);color:var(--text);padding:12px;border-radius:999px;font-weight:600;cursor:pointer;">' + t('no') + '</button>' +
                    '<button id="exitYes" style="flex:1;background:var(--danger);border:none;color:#fff;padding:12px;border-radius:999px;font-weight:600;cursor:pointer;">' + t('yes') + '</button>' +
                '</div>' +
            '</div>';
        document.body.appendChild(ov);

        document.getElementById('exitNo').onclick = function() {
            ov.remove();
            if (wasPlaying) {
                isPaused = false;
                spawnInterval = setInterval(createItem, getSpawnSpeed());
                startTimerInterval();
                startBonusTimeInterval();
                startPowerUpInterval();
                moveItemsLoop();
            }
        };
        document.getElementById('exitYes').onclick = function() {
            stopMusic();
            if (window.Capacitor) { try { window.Capacitor.Plugins.App.exitApp(); } catch (e1) { try { navigator.app.exitApp(); } catch (e2) { window.history.go(-window.history.length); } } }
            else { window.close(); }
        };
    };

    dom.restartLevelBtn.onclick = function() { if (gameStarted) restartCurrentLevel(); };
    dom.pauseResumeBtn.onclick = function() { if (gameStarted) togglePause(); };
    
    // Mağaza ve İstatistik butonları
    var shopBtn = document.getElementById('shopBtn');
    var statsBtn = document.getElementById('statsBtn');
    if (shopBtn) shopBtn.onclick = function() { if (gameStarted) showShop(); };
    if (statsBtn) statsBtn.onclick = function() { if (gameStarted) showStatistics(); };

    var splashLbBtn = document.getElementById('splashLeaderboardBtn');
    var splashAchBtn = document.getElementById('splashAchievementsBtn');
    var splashShopBtn = document.getElementById('splashShopBtn');
    var splashStatsBtn = document.getElementById('splashStatsBtn');
    var selectModeBtn = document.getElementById('selectModeBtn');
    if (splashLbBtn) splashLbBtn.onclick = function() { showLeaderboard(); };
    if (splashAchBtn) splashAchBtn.onclick = function() { showAchievementsScreen(); };
    if (splashShopBtn) splashShopBtn.onclick = function() { showShop(); };
    var splashSettingsBtn = document.getElementById('splashSettingsBtn');
    if (splashSettingsBtn) splashSettingsBtn.onclick = function() { showSettings(); };
    if (splashStatsBtn) splashStatsBtn.onclick = function() { showStatistics(); };
    if (selectModeBtn) selectModeBtn.onclick = function() { showModeSelection(); };

    // VIP badge ve yıldız bakiyesi tıklamaları
    var vipBadgeEl = document.getElementById('vipBadgeInline');
    var starBalEl = document.getElementById('starBalanceInline');
    if (vipBadgeEl) vipBadgeEl.onclick = function() { showShop(); };
    if (starBalEl) starBalEl.onclick = function() { showShop(); };

    // Dil: statik arayüzü çevir + buton etiketini ayarla
    document.documentElement.lang = currentLang;
    applyStaticI18n();
    updateLangButton();

    // Sayfa yüklenince kayıtlı mağaza verisini (yıldız bakiyesi, sahip olunan kostüm/sepet, VIP) yükle
    loadShopData();
    updateVIPUI();
    updateStarUI();

    // Günlük giriş serisini kontrol et (splash görünürken)
    setTimeout(checkDailyLoginStreak, 700);

    // Google Play Billing + AdMob başlat (cihazda deviceready sonrası, web'de sessizce atlanır)
    if (window.cordova) {
        document.addEventListener('deviceready', function() { initIAP(); initAds(); }, false);
    } else {
        setTimeout(function() { initIAP(); initAds(); }, 1500);
    }
    
    // Power-up spawn interval (her 15-25 saniyede bir)
    setInterval(function() {
        if (gameActive && !isPaused && gameStarted) {
            spawnPowerUp();
        }
    }, 15000 + Math.random() * 10000);
    
    setupDragDrop();
    window.addEventListener('resize', function() {
        if (gameStarted) {
            drawBackground(currentLevel);
            if (renderer && camera) {
                var area = document.getElementById('gameArea');
                renderer.setSize(area.offsetWidth, area.offsetHeight);
                camera.aspect = area.offsetWidth / area.offsetHeight;
                camera.updateProjectionMatrix();
            }
        }
    });
})();
</script>
</body>
</html>
