<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Star Catch</title>
    <script src="lib/three.min.js"></script>
    <style>
        /* ===== TASARIM SİSTEMİ ===== */
        :root {
            /* Marka: derin mor-indigo zemin + amber vurgu (uygulama ikonuyla aynı ikili) */
            --bg: #0B0A1F;
            --bg-2: #191634;
            --bg-3: #221C46;
            --surface: rgba(255,255,255,0.06);
            --surface-2: rgba(255,255,255,0.10);
            --border: rgba(160,140,255,0.16);
            --border-2: rgba(180,160,255,0.28);
            --accent: #FFB020;
            --accent-2: #FFD35C;
            --accent-dim: rgba(255,176,32,0.16);
            --accent-ink: #2A1B00;
            --violet: #8B5CF6;
            --violet-glow: rgba(139,92,246,0.35);
            --text: #FFFFFF;
            --text-2: rgba(255,255,255,0.70);
            --text-3: rgba(255,255,255,0.45);
            --danger: #E5484D;
            --radius: 12px;
            --radius-lg: 18px;
            --banner-h: 0px; /* JS banner yüklenince günceller */
        }
        * { user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        /* Android 15+ (targetSdk 35+) edge-to-edge zorunlu: içerik sistem çubuklarının
           altına çizilir. Tüm sabit öğeler safe-area inset'lerine göre konumlanır. */
        html, body { height: 100%; overflow: hidden; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text); display: flex; justify-content: center;
               background:
                 radial-gradient(100% 45% at 50% 0%, rgba(139,92,246,0.20), transparent 60%),
                 radial-gradient(90% 40% at 50% 100%, rgba(99,102,241,0.14), transparent 65%),
                 linear-gradient(180deg, #120E2E 0%, #0B0A1F 50%, #08071C 100%);
               /* Alt boşluk: safe-area + banner reklam yüksekliği (--banner-h JS'ten gelir).
                  Böylece native banner alt buton çubuğunu ASLA örtmez. */
               padding: calc(6px + env(safe-area-inset-top, 0px)) calc(6px + env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px) + var(--banner-h, 0px)) calc(6px + env(safe-area-inset-left, 0px));
               transition: padding-bottom 0.2s ease; }
        .game-container { max-width: 900px; width: 100%; height: 100%; display: flex; flex-direction: column; gap: 8px; background: transparent; border-radius: 0; padding: 0; box-shadow: none; border: none; }

        /* Ayarlar düğmesi (yüzen tek kontrol) */
        .settings-btn {
            position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px));
            background: rgba(139,92,246,0.18); border: 1px solid rgba(167,139,250,0.34); border-radius: 50%;
            width: 38px; height: 38px; font-size: 1rem; color: #D8CCFF; cursor: pointer;
            z-index: 1100; display: flex; align-items: center; justify-content: center;
        }
        .settings-btn:active { background: var(--surface); }
        /* Modal açıkken yüzen kontroller gizlenir */
        body.modal-open .floating-ui { display: none !important; }

        /* Ayarlar paneli */
        .settings-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 6800; display: flex; align-items: flex-end; justify-content: center; }
        .settings-sheet { width: 100%; max-width: 460px; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom,0px) + var(--banner-h, 0px)); }
        .settings-title { font-size: 1rem; font-weight: 600; margin-bottom: 14px; color: var(--text); }
        .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 2px; border-top: 1px solid var(--border); font-size: 0.88rem; color: var(--text-2); cursor: pointer; }
        .settings-row:first-of-type { border-top: none; }
        .settings-val { color: var(--accent); font-weight: 600; font-size: 0.82rem; }
        .settings-close { width: 100%; margin-top: 14px; background: var(--surface-2); border: 1px solid var(--border-2); border-radius: 999px; padding: 12px; color: var(--text); font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .settings-danger { color: var(--danger); }

        /* ===== VIP ROZET ===== */
        #vipBadge {
            position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px));
            background: linear-gradient(135deg, #7b1fa2, #4a148c);
            border: 1.5px solid #ce93d8; border-radius: 20px;
            padding: 6px 12px; font-size: 0.72rem; font-weight: bold;
            color: #f3e5f5; cursor: pointer; z-index: 1100;
            display: none; gap: 5px; align-items: center;
        }
        #vipBadge.active { display: flex; }
        #starBalance {
            position: fixed; top: calc(44px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px));
            background: rgba(0,0,0,0.65); border: 1px solid rgba(255,210,0,0.4);
            border-radius: 16px; padding: 4px 10px; font-size: 0.7rem;
            color: #ffd700; cursor: pointer; z-index: 1100; display: flex; align-items: center; gap: 4px;
        }

        /* ===== MAĞAZA OVERLAY ===== */
        .shop-overlay {
            position: fixed; inset: 0;
            background:
              radial-gradient(100% 40% at 50% 0%, rgba(139,92,246,0.22), transparent 60%),
              linear-gradient(180deg, #120E2E 0%, #0B0A1F 60%, #08071C 100%);
            z-index: 5000; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top,0px)) 12px calc(40px + env(safe-area-inset-bottom,0px) + var(--banner-h, 0px)); overscroll-behavior: contain;
        }
        .shop-header-bar {
            display: flex; align-items: center; margin-bottom: 18px;
        }
        .shop-header-title { font-size: 1.2rem; font-weight: 700; color: var(--text); flex: 1; }
        .shop-close-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%; width: 36px; height: 36px; color: white; font-size: 1rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .shop-balance-bar {
            background: rgba(255,210,0,0.12); border: 1px solid rgba(255,210,0,0.3);
            border-radius: 14px; padding: 10px 16px; display: flex; align-items: center;
            gap: 10px; margin-bottom: 20px;
        }
        .shop-balance-amount { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
        .shop-balance-label { font-size: 0.75rem; color: rgba(255,255,255,0.5); }
        .shop-section-title {
            font-size: 0.68rem; font-weight: bold; color: rgba(255,255,255,0.4);
            letter-spacing: 1px; text-transform: uppercase; margin: 20px 0 10px;
        }
        .shop-card {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 14px 16px; margin-bottom: 10px;
            display: flex; align-items: center; gap: 14px;
        }
        .shop-card.vip-card { border-color: rgba(206,147,216,0.5); background: rgba(123,31,162,0.18); }
        .shop-card.featured { border-color: rgba(76,175,80,0.6); background: rgba(27,94,32,0.15); }
        .shop-card.starter-card { border-color: rgba(255,193,7,0.6); background: rgba(255,193,7,0.08); }
        .shop-card-icon { font-size: 2.2rem; min-width: 44px; text-align: center; }
        .shop-card-body { flex: 1; min-width: 0; }
        .shop-card-name { font-size: 0.92rem; font-weight: bold; color: white; }
        .shop-card-desc { font-size: 0.75rem; color: rgba(255,255,255,0.55); margin-top: 3px; }
        .shop-card-bonus { font-size: 0.72rem; color: var(--accent); font-weight: 600; margin-top: 2px; }
        .shop-badge { display: inline-block; font-size: 0.6rem; padding: 2px 7px; border-radius: 8px; font-weight: bold; margin-left: 6px; vertical-align: middle; }
        .shop-badge-pop { background: rgba(76,175,80,0.25); color: #81c784; border: 1px solid #388e3c; }
        .shop-badge-new { background: rgba(244,67,54,0.2); color: #ef9a9a; border: 1px solid #c62828; }
        .shop-badge-vip { background: rgba(206,147,216,0.2); color: #ce93d8; border: 1px solid #7b1fa2; }
        .shop-buy-btn {
            background: var(--accent);
            border: none; border-radius: 999px; padding: 9px 16px;
            font-size: 0.8rem; font-weight: 700; color: var(--accent-ink); cursor: pointer;
            white-space: nowrap; min-width: 80px; text-align: center;
        }
        .shop-buy-btn.green { background: var(--accent); }
        .shop-buy-btn.amber { background: var(--accent); }
        .shop-buy-btn.stars { background: var(--accent); }
        .shop-buy-btn.owned { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.4); cursor: default; }
        .vip-perks-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
        .vip-perk { background: rgba(255,255,255,0.06); border-radius: 8px; padding: 5px 8px; font-size: 0.7rem; color: rgba(255,255,255,0.7); }
        .vip-status-bar { background: rgba(123,31,162,0.25); border: 1px solid rgba(206,147,216,0.3); border-radius: 12px; padding: 10px 14px; margin-bottom: 6px; font-size: 0.8rem; color: #ce93d8; text-align: center; }
        /* VIP değer paketi */
        .vip-benefits { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
        .vip-benefit { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 8px 10px; }
        .vip-benefit .vb-ico { font-size: 1.3rem; min-width: 26px; text-align: center; }
        .vip-benefit b { display: block; font-size: 0.82rem; color: #fff; font-weight: 700; }
        .vip-benefit small { display: block; font-size: 0.68rem; color: rgba(255,255,255,0.5); margin-top: 1px; }
        .vip-plan-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .vip-plan { position: relative; border-radius: 16px; padding: 14px 8px 12px; cursor: pointer; text-align: center; border: 1.5px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #fff; }
        .vip-plan.yearly { border-color: #ce93d8; background: linear-gradient(160deg, rgba(199,125,255,0.22), rgba(123,31,162,0.28)); }
        .vip-plan .vp-tag { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: linear-gradient(135deg,#ffd54f,#ff9800); color: #4a2b00; font-size: 0.55rem; font-weight: 900; padding: 3px 8px; border-radius: 10px; letter-spacing: 0.3px; }
        .vip-plan .vp-name { font-size: 0.78rem; color: rgba(255,255,255,0.7); font-weight: 600; }
        .vip-plan .vp-price { font-size: 1.25rem; font-weight: 900; color: #fff; margin-top: 3px; }
        .vip-plan.yearly .vp-price { color: #f3c6ff; }
        .vip-plan .vp-sub { font-size: 0.62rem; color: rgba(255,255,255,0.45); margin-top: 1px; }
        .vip-plan:active { transform: scale(0.97); }
        .cosm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .cosm-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 12px 8px; text-align: center; }
        .cosm-card.equipped { border-color: rgba(76,175,80,0.6); background: rgba(27,94,32,0.15); }
        .cosm-icon { font-size: 2.4rem; }
        .cosm-name { font-size: 0.75rem; color: rgba(255,255,255,0.7); margin-top: 5px; }
        .cosm-price { font-size: 0.7rem; color: #ffd700; margin-top: 4px; font-weight: bold; }
        .cosm-buy-btn { margin-top: 8px; background: rgba(255,210,0,0.15); border: 1px solid rgba(255,210,0,0.35); border-radius: 10px; padding: 5px 12px; font-size: 0.72rem; color: #ffd700; cursor: pointer; }
        .cosm-buy-btn.owned { background: rgba(76,175,80,0.15); border-color: #388e3c; color: #81c784; cursor: default; }

        /* ===== SATIN ALMA ONAY ===== */
        .purchase-confirm-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center; z-index: 6000;
        }
        .purchase-confirm-card {
            background: var(--bg-2); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 26px 22px; text-align: center;
            max-width: 320px; width: 88%; max-height: 88vh; overflow-y: auto;
        }
        /* ===== TUTORIAL ===== */
        .tut-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.72); z-index: 7000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
        .tut-hand { font-size: 3.5rem; animation: tutTap 1.1s ease-in-out infinite; }
        @keyframes tutTap { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-18px) scale(1.15); } }
        .tut-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px 20px; max-width: 320px; width: 90%; margin-top: 10px; }
        .tut-title { font-size: 1.1rem; font-weight: 700; color: var(--text); margin-bottom: 12px; }
        .tut-row { display: flex; align-items: center; gap: 12px; text-align: left; margin: 10px 0; font-size: 0.9rem; color: #fff; }
        .tut-row .tr-ico { font-size: 1.8rem; min-width: 36px; text-align: center; }
        .tut-btn { width: 100%; margin-top: 16px; background: var(--accent); border: none; border-radius: 999px; padding: 13px; font-size: 0.98rem; font-weight: 700; color: var(--accent-ink); cursor: pointer; }
        /* ===== GÜNLÜK GİRİŞ SERİSİ ===== */
        .streak-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 6500; }
        .streak-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px 18px; text-align: center; max-width: 340px; width: 90%; max-height: 88vh; overflow-y: auto; }
        .streak-title { font-size: 1.15rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .streak-sub { font-size: 0.75rem; color: rgba(255,255,255,0.55); margin-bottom: 16px; }
        .streak-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
        .streak-cell { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 8px 4px; }
        .streak-cell.claimed { background: rgba(76,175,80,0.18); border-color: #388e3c; opacity: 0.7; }
        .streak-cell.today { background: linear-gradient(160deg,rgba(255,193,7,0.28),rgba(255,140,0,0.22)); border-color: #ffca28; transform: scale(1.06); box-shadow: 0 0 18px rgba(255,180,60,0.4); }
        .streak-cell.big { grid-column: span 4; }
        .streak-cell .sc-day { font-size: 0.6rem; color: rgba(255,255,255,0.5); font-weight: 700; }
        .streak-cell .sc-icon { font-size: 1.3rem; margin: 2px 0; }
        .streak-cell.big .sc-icon { font-size: 1.8rem; }
        .streak-cell .sc-amt { font-size: 0.72rem; color: #ffd54f; font-weight: 900; }
        .streak-cell.today .sc-amt { color: #fff; }
        .streak-claim-btn { width: 100%; background: var(--accent); border: none; border-radius: 999px; padding: 13px; font-size: 0.98rem; font-weight: 700; color: var(--accent-ink); cursor: pointer; }
        .streak-claim-btn:active { transform: scale(0.97); }
        /* ===== SPLASH EKRANI ===== */
        .splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            /* Derinlik: mor-indigo ışık havuzları + koyu zemin */
            background:
                radial-gradient(110% 70% at 50% -5%, rgba(139,92,246,0.30), transparent 60%),
                radial-gradient(90% 60% at 15% 105%, rgba(255,176,32,0.14), transparent 65%),
                radial-gradient(80% 55% at 90% 85%, rgba(99,102,241,0.20), transparent 60%),
                linear-gradient(180deg, #120E2E 0%, #0B0A1F 55%, #07061A 100%);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000; overflow: hidden;
        }
        #splash-canvas {
            position: absolute; inset: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        .splash-card {
            position: relative; z-index: 1;
            background: linear-gradient(168deg, #3B2F7E 0%, #2A2160 38%, #191340 100%);
            overflow: hidden;
            border-radius: 24px; padding: 30px 24px;
            max-width: 400px; width: 90%; text-align: center;
            border: 1px solid var(--border-2);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 18px 50px rgba(0,0,0,0.55),
                0 0 60px var(--violet-glow);
            animation: cardAppear 0.5s 0.12s cubic-bezier(0.22,1,0.36,1) both;
        }
        .splash-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 45%;
            background: linear-gradient(180deg, rgba(255,255,255,0.10), transparent);
            pointer-events: none; border-radius: 24px 24px 0 0;
        }
        .splash-card > * { position: relative; z-index: 1; }
        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(18px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Dil düğmesi */
        #langToggleBtn {
            position: absolute; top: 12px; right: 12px;
            background: var(--surface-2); border: 1px solid var(--border-2);
            border-radius: 999px; padding: 5px 12px;
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px;
            color: var(--text-2); cursor: pointer; z-index: 5;
        }

        /* Başlık — amber degrade */
        .splash-title {
            font-size: 2.15rem; font-weight: 800; letter-spacing: -0.5px;
            background: linear-gradient(180deg, #FFF3D0 0%, var(--accent-2) 45%, var(--accent) 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            margin-bottom: 6px; line-height: 1.15;
            filter: drop-shadow(0 2px 12px rgba(255,176,32,0.35));
            opacity: 0; animation: fadeSlideDown 0.5s 0.36s ease both;
        }
        .splash-sub {
            font-size: 0.78rem; color: var(--text-2); letter-spacing: 0.3px;
            opacity: 0; animation: fadeSlideDown 0.45s 0.48s ease both;
        }
        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Marka görseli — parlayan yıldız */
        .splash-hero {
            font-size: 4.2rem; margin: 18px 0 16px;
            display: block; line-height: 1;
            filter: drop-shadow(0 0 22px rgba(255,190,60,0.55));
            opacity: 0; animation: heroIn 0.6s 0.58s cubic-bezier(0.22,1,0.36,1) both, heroFloat 3.6s 1.2s ease-in-out infinite;
        }
        @keyframes heroIn {
            from { opacity: 0; transform: translateY(14px) scale(0.86); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes heroFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-7px); }
        }

        /* Rozetler */
        .splash-features { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 4px 0 20px; }
        .feature-badge {
            background: rgba(255,176,32,0.13); border: 1px solid rgba(255,199,87,0.42);
            padding: 5px 11px; border-radius: 999px; font-size: 0.69rem; font-weight: 600; color: #FFDFA0;
            opacity: 0; animation: fadeSlideUp 0.4s 0.72s ease both;
        }

        /* Butonlar */
        .start-btn {
            background: linear-gradient(180deg, var(--accent-2), var(--accent));
            border: none; padding: 15px 28px; border-radius: 999px;
            font-size: 1.05rem; font-weight: 800; letter-spacing: 0.2px;
            color: var(--accent-ink); cursor: pointer;
            width: 100%; margin-top: 4px;
            box-shadow: 0 8px 26px rgba(255,176,32,0.45), 0 0 0 1px rgba(255,255,255,0.22) inset;
            opacity: 0; animation: fadeSlideUp 0.45s 0.82s ease both, ctaPulse 2.8s 1.4s ease-in-out infinite;
            transition: transform 0.08s, filter 0.15s;
        }
        .start-btn:active { transform: scale(0.985); filter: brightness(0.94); }
        @keyframes ctaPulse {
            0%, 100% { box-shadow: 0 8px 26px rgba(255,176,32,0.45), 0 0 0 1px rgba(255,255,255,0.22) inset; }
            50%      { box-shadow: 0 8px 38px rgba(255,176,32,0.72), 0 0 0 1px rgba(255,255,255,0.30) inset; }
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        /* ===== KOMPAKT HUD ===== */
        .topbar { display: flex; align-items: center; gap: 10px; background: rgba(139,92,246,0.10); border: 1px solid rgba(167,139,250,0.24); border-radius: var(--radius); padding: 8px 10px 8px 46px; flex-shrink: 0; }
        .level-badge { background: var(--accent); padding: 4px 9px; border-radius: 8px; color: var(--accent-ink); font-weight: 700; font-size: 0.72rem; flex-shrink: 0; }
        .level-name { font-size: 0.8rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
        .rank-badge { font-size: 0.62rem; color: var(--text-3); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; flex-shrink: 0; }
        .hud-star { font-size: 0.72rem; font-weight: 700; color: var(--accent); background: var(--accent-dim); border-radius: 999px; padding: 3px 9px; flex-shrink: 0; cursor: pointer; }
        .hud-vip { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.5px; color: #E9D5FF; background: rgba(147,51,234,0.22); border: 1px solid rgba(196,132,252,0.5); border-radius: 999px; padding: 3px 8px; flex-shrink: 0; cursor: pointer; display: none; }
        .hud-vip.active { display: block; }
        .progress-row { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .progress { width: 100%; background: rgba(0,0,0,0.35); border-radius: 999px; height: 6px; overflow: hidden; }
        .progress-fill { background: var(--accent); width: 0%; height: 100%; transition: width 0.3s; }
        .goal-text { font-size: 0.68rem; color: var(--text-2); white-space: nowrap; flex-shrink: 0; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex-shrink: 0; }
        .stat-card { background: rgba(139,92,246,0.10); border: 1px solid rgba(167,139,250,0.22); border-radius: var(--radius); padding: 6px 4px; text-align: center; }
        .stat-value { font-size: 1.05rem; font-weight: 700; color: var(--text); line-height: 1.2; }
        .stat-label { font-size: 0.55rem; color: var(--text-3); letter-spacing: 0.4px; }
        .quest-card { background: rgba(139,92,246,0.10); border: 1px solid rgba(167,139,250,0.22); border-radius: var(--radius); padding: 7px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-shrink: 0; }
        .quest-text { font-size: 0.74rem; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        .quest-progress { background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 999px; padding: 3px 9px; color: var(--accent); font-weight: 700; font-size: 0.7rem; flex-shrink: 0; }
        .quest-progress.done { background: var(--accent); color: var(--accent-ink); }
        .game-area { background: linear-gradient(180deg, #080A1C, #0F1130); border-radius: var(--radius-lg); padding: 10px; position: relative; flex: 1; min-height: 0; border: 1px solid rgba(167,139,250,0.24); box-shadow: 0 0 30px rgba(139,92,246,0.14); overflow: hidden; }
        /* Oyun bildirimi (eski konuşma balonunun yerine) */
        #gameToast { position: absolute; top: 10px; left: 50%; transform: translateX(-50%) translateY(-8px); background: rgba(0,0,0,0.72); border: 1px solid var(--border-2); border-radius: 999px; padding: 7px 14px; font-size: 0.74rem; color: var(--text); max-width: 88%; text-align: center; z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; }
        #gameToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #three-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        #gameBgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
        #celebCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 8; }
        #comboFlash { position: absolute; inset: 0; pointer-events: none; z-index: 7; border-radius: 20px; opacity: 0; transition: opacity 0.1s; }
        .floating-item { position: absolute; font-size: 2.5rem; cursor: pointer; filter: drop-shadow(0 0 10px gold); animation: itemFloat 2s infinite; transition: all 0.1s; z-index: 10; }
        @keyframes itemFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .basket { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 100px; height: 85px; background: linear-gradient(145deg, #ffcc88, #ffaa66); border-radius: 0 0 56px 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 9px solid #b97f44; cursor: pointer; z-index: 20; box-shadow: 0 8px 22px rgba(255,130,70,0.4); }
        .basket::before { content: ''; position: absolute; top: -11px; left: 50%; transform: translateX(-50%); width: 114px; height: 22px; background: #ffb566; border-radius: 50%; }
        .basket-icon { font-size: 1.8rem; }
        .basket-quest-icon { font-size: 0.9rem; background: rgba(0,0,0,0.5); border-radius: 50%; padding: 3px; margin-top: 3px; }
        .skills { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; flex-shrink: 0; }
        .skills:empty { display: none; }
        .skill-btn { background: var(--accent-dim); border: 1px solid var(--accent); padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: 0.68rem; color: var(--accent); cursor: pointer; }
        .skill-btn.disabled { opacity: 0.35; cursor: default; border-color: var(--border); color: var(--text-3); background: var(--surface); }
        .button-bar { display: flex; justify-content: center; gap: 6px; flex-shrink: 0; }
        .big-btn { background: rgba(139,92,246,0.14); border: 1px solid rgba(167,139,250,0.30); padding: 10px 14px; border-radius: 999px; font-weight: 600; font-size: 0.74rem; color: #D8CCFF; cursor: pointer; flex: 1; max-width: 130px; }
        .big-btn:active { background: rgba(139,92,246,0.26); }
        .big-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
        .big-btn.green { background: var(--surface-2); border-color: var(--border-2); color: var(--text-2); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 4000; }
        .popup-card { background: var(--bg-2); border-radius: var(--radius-lg); padding: 26px 22px; text-align: center; max-width: 380px; width: 88%; border: 1px solid var(--border); max-height: 88vh; overflow-y: auto; }
        .popup-title { font-size: 1.4rem; font-weight: 700; color: var(--text); margin: 10px 0; }
        .popup-stats { font-size: 1.1rem; color: white; margin: 10px 0; }
        .popup-btn { box-shadow: none !important; background: #ff8844; border: none; padding: 12px 25px; border-radius: 25px; font-size: 1rem; color: white; cursor: pointer; margin: 5px; }
        .float-number { position: fixed; pointer-events: none; animation: floatUp 1s forwards; font-weight: bold; font-size: 1.5rem; color: #ffd700; z-index: 1100; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-60px); } }
        .countdown-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 1500; }
        .countdown-number { font-size: 8rem; color: #ffdd77; text-shadow: 0 0 50px #ffaa44; }
        .level-transition { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(255,200,100,0.3), rgba(0,0,0,0.95)); display: flex; align-items: center; justify-content: center; z-index: 3000; opacity: 0; pointer-events: none; transition: opacity 0.5s; }
        .level-transition.active { opacity: 1; pointer-events: auto; }
        .level-transition-icon { font-size: 6rem; animation: spin 2s linear infinite; }
        @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
        @media (max-width: 600px) { .game-area { min-height: 50vh; } .floating-item { font-size: 2rem; } .basket { width: 84px; height: 70px; } .basket::before { width: 96px; height: 18px; top: -9px; } .basket-icon { font-size: 1.5rem; } .splash-title { font-size: 1.8rem; } }

        /* Sepet sürükleme */
        .basket { touch-action: none; cursor: grab; }
        .basket:active { cursor: grabbing; }

        /* Eşya kaybolma animasyonu */
        .floating-item { transition: transform 0.3s ease, opacity 0.3s ease; }
        .floating-item.fading { transform: scale(0) !important; opacity: 0 !important; }
        .floating-item.caught { transform: scale(1.4) !important; opacity: 0 !important; filter: drop-shadow(0 0 20px gold) !important; }

        /* Combo popup */
        #combo-popup {
            position: absolute; top: 40%; left: 50%;
            transform: translate(-50%, -50%) scale(1);
            font-size: 3rem; font-weight: bold;
            color: #ffdd00; text-shadow: 0 0 20px #ff8800, 0 0 40px #ff4400;
            pointer-events: none; z-index: 50;
            opacity: 0; transition: opacity 0.25s, transform 0.25s;
            white-space: nowrap;
        }

        /* Süre uyarısı */
        @keyframes timerPulse { 0%,100% { transform: scale(1); color: #ff4444; } 50% { transform: scale(1.3); color: #ffdd00; } }
        .timer-warning { animation: timerPulse 0.5s infinite !important; }

        /* Sepet yakalama animasyonu */
        @keyframes basketCatch { 0% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.15); } 100% { transform: translateX(-50%) scale(1); } }
        .basket-catch { animation: basketCatch 0.15s ease; }

        /* Kayıtlı oyun butonu */
        .continue-btn {
            background: rgba(139,92,246,0.22); border: 1px solid rgba(167,139,250,0.45);
            padding: 12px 28px; border-radius: 999px;
            font-size: 0.92rem; font-weight: 700; color: #EDE4FF; cursor: pointer;
            width: 100%; margin-top: 8px;
            opacity: 0; animation: fadeSlideUp 0.45s 0.92s ease both;
            transition: background 0.15s;
        }
        .continue-btn:active { background: var(--surface); }

        /* Splash çıkış animasyonu */
        .splash-screen.hiding {
            animation: splashHide 0.55s ease-in forwards;
        }
        @keyframes splashHide {
            0%   { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.08); pointer-events: none; }
        }

        /* Zararlı eşya */
        .floating-item.harmful { filter: drop-shadow(0 0 10px red) !important; animation: harmfulFloat 0.8s infinite alternate !important; }
        @keyframes harmfulFloat { 0% { transform: translateY(0) rotate(-5deg); } 100% { transform: translateY(-8px) rotate(5deg); } }

        /* Bonus süre eşyası */
        .floating-item.bonus-time { filter: drop-shadow(0 0 12px cyan) !important; animation: bonusSpin 1.5s linear infinite !important; }
        @keyframes bonusSpin { from { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } to { transform: rotate(360deg) scale(1); } }

        /* Yıldız sistemi */
        .stars-display { display: flex; justify-content: center; gap: 8px; margin: 12px 0; }
        .star-icon { font-size: 2.5rem; opacity: 0.2; transition: opacity 0.4s, transform 0.4s; transform: scale(0.5); }
        .star-icon.earned { opacity: 1; transform: scale(1.2); }

        /* Başarım toast */
        #achievement-toast { position: fixed; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); left: calc(15px + env(safe-area-inset-left, 0px)); background: linear-gradient(135deg, #2d1b69, #4a2090); border: 1px solid #ffaa44; border-radius: 16px; padding: 12px 16px; color: white; font-size: 0.85rem; z-index: 2000; display: none; max-width: 260px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        #achievement-toast .ach-icon { font-size: 1.8rem; display: block; margin-bottom: 4px; }
        #achievement-toast .ach-name { font-weight: bold; color: #ffdd77; }

        /* Günlük görev paneli */
        .daily-quests { display: block !important; background: rgba(255,224,163,0.1); border-radius: 15px; padding: 8px 12px; margin-top: 8px; border: 1px solid rgba(255,170,100,0.3); }
        .daily-header { color: #ffcc80; font-weight: bold; font-size: 0.8rem; margin-bottom: 6px; }
        .daily-list { display: flex; flex-direction: column; gap: 5px; }
        .daily-item { background: rgba(255,255,255,0.08); border-radius: 10px; padding: 5px 10px; font-size: 0.72rem; color: #ffcc80; display: flex; justify-content: space-between; align-items: center; }
        .daily-item.completed { background: rgba(76,175,80,0.3); color: #a5d6a7; }
        .daily-progress { font-weight: bold; color: #ffdd77; }

        /* Skor tablosu */
        .leaderboard-row { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 10px; margin: 5px 0; background: rgba(255,255,255,0.07); color: white; font-size: 0.85rem; }
        .leaderboard-row:first-child { background: rgba(255,215,0,0.2); }
        .leaderboard-row:nth-child(2) { background: rgba(192,192,192,0.2); }
        .leaderboard-row:nth-child(3) { background: rgba(205,127,50,0.2); }
        .lb-rank { font-weight: bold; color: #ffdd77; width: 24px; }
        .lb-score { font-weight: bold; color: #ffcc80; }

        /* Splash butonlar */
        .splash-btn-row { display: flex; gap: 8px; margin-top: 8px; }
        .splash-small-btn { flex: 1; background: linear-gradient(180deg, rgba(167,139,250,0.26), rgba(124,90,220,0.14)); border: 1px solid rgba(190,165,255,0.45); box-shadow: 0 1px 0 rgba(255,255,255,0.14) inset, 0 4px 12px rgba(0,0,0,0.28); padding: 12px 8px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; color: #EFE7FF; cursor: pointer; transition: filter 0.15s, transform 0.08s; }
        .splash-small-btn:active { filter: brightness(1.25); transform: scale(0.98); }

        /* Level Bilgilendirme Popup */
        #levelBriefingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.88); display: flex; align-items: center; justify-content: center;
            z-index: 3500;
        }
        .briefing-card { max-height: 88vh; overflow-y: auto;
            background: var(--bg-2);
            border-radius: var(--radius-lg); padding: 24px 20px; max-width: 380px; width: 88%;
            border: 1px solid var(--border);
            animation: briefingPop 0.3s ease-out both;
        }
        @keyframes briefingPop {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .briefing-title { overflow-wrap: anywhere; line-height: 1.3;
            text-align: center; font-size: 1.15rem; font-weight: 700;
            color: var(--text); margin-bottom: 4px;
        }
        .briefing-level-icon {
            display: block; text-align: center; font-size: 2.8rem; margin: 12px 0 8px;
        }
        .briefing-rows { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
        .briefing-row {
            display: flex; align-items: center; gap: 12px;
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 12px;
        }
        .briefing-row.bad   { border-color: rgba(229,72,77,0.45); }
        .briefing-row-icon  { font-size: 1.6rem; min-width: 32px; text-align: center; }
        .briefing-row-text  { flex: 1; min-width: 0; }
        .briefing-row-label { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-3); }
        .briefing-row.bad   .briefing-row-label { color: #FF9AA0; }
        .briefing-row-desc  { font-size: 0.84rem; color: var(--text); font-weight: 500; margin-top: 2px; overflow-wrap: anywhere; }
        .briefing-meta {
            display: flex; gap: 8px; justify-content: center; margin: 8px 0 14px;
        }
        .briefing-meta-chip {
            background: rgba(255,180,60,0.18); border: 1px solid rgba(255,180,60,0.4);
            border-radius: 20px; padding: 5px 14px; color: #ffd090; font-size: 0.75rem; font-weight: bold;
        }
        .briefing-start-btn { background: var(--accent) !important; color: var(--accent-ink) !important; box-shadow: none !important;
            width: 100%; background: linear-gradient(135deg, #ff8c00, #ff5500);
            border: none; border-radius: 50px; padding: 15px;
            font-size: 1.1rem; font-weight: 900; color: white; cursor: pointer;
            box-shadow: 0 6px 0 #c43d00, 0 0 24px rgba(255,120,0,0.5);
            transition: transform 0.08s, box-shadow 0.08s;
        }
        .briefing-start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c43d00; }

        /* Boss Level */
        .game-area.boss-mode { border-color: rgba(255,30,30,0.9) !important; animation: bossGlow 1s ease-in-out infinite alternate !important; }
        @keyframes bossGlow { from { box-shadow: 0 0 20px rgba(255,0,0,0.25) inset; } to { box-shadow: 0 0 60px rgba(255,50,0,0.65) inset; } }
        .boss-badge { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg,#cc0000,#ff4400); color: white; font-weight: 900; font-size: 0.72rem; padding: 4px 14px; border-radius: 20px; z-index: 15; animation: bossBlink 0.7s ease-in-out infinite alternate; pointer-events: none; letter-spacing: 0.5px; }
        @keyframes bossBlink { from { opacity: 0.8; transform: translateX(-50%) scale(1); } to { opacity: 1; transform: translateX(-50%) scale(1.06); } }
        .briefing-card.boss { border-color: rgba(255,80,0,0.6); box-shadow: 0 0 40px rgba(255,60,0,0.35), 0 20px 50px rgba(0,0,0,0.6); }
        .briefing-title.boss { background: linear-gradient(135deg,#ff4400,#ffaa00); -webkit-background-clip:text; background-clip:text; color:transparent; }
        .briefing-boss-warn { background: rgba(255,30,0,0.18); border: 1px solid rgba(255,60,0,0.5); border-radius: 12px; padding: 9px 13px; color: #ffaaaa; font-size: 0.82rem; font-weight: bold; text-align: center; margin: 8px 0; }
        .briefing-start-btn.boss { background: linear-gradient(135deg,#cc0000,#ff3300); box-shadow: 0 6px 0 #880000, 0 0 24px rgba(255,60,0,0.55); }

        /* Power-up eşyalar */
        .floating-item.power-up { animation: powerUpPulse 0.55s ease-in-out infinite alternate !important; font-size: 2.3rem !important; z-index: 15 !important; }
        @keyframes powerUpPulse { from { transform: scale(1) rotate(-6deg); } to { transform: scale(1.25) rotate(6deg); } }

        /* Streak göstergesi */
        #streakDisplay { position: absolute; top: 8px; right: 8px; z-index: 15; background: linear-gradient(135deg,rgba(255,80,0,0.88),rgba(255,160,0,0.88)); border-radius: 16px; padding: 4px 11px; color: white; font-size: 0.72rem; font-weight: 900; display: none; pointer-events: none; box-shadow: 0 2px 12px rgba(255,80,0,0.5); white-space: nowrap; }

        /* Kedi kostüm etiketi */
        #catCostumeLabel { font-size: 0.58rem; background: rgba(255,200,80,0.22); border-radius: 8px; padding: 1px 5px; color: #ffdd77; text-align: center; margin-top: 2px; display: block; }

        /* Altın eşya */
        .floating-item.golden {
            filter: drop-shadow(0 0 12px #ffd700) drop-shadow(0 0 28px #ffaa00) !important;
            animation: goldenPulse 0.45s ease-in-out infinite alternate !important;
            font-size: 3rem !important; z-index: 18 !important;
        }
        @keyframes goldenPulse {
            from { transform: scale(1) rotate(-10deg); }
            to   { transform: scale(1.35) rotate(10deg); }
        }

        /* Ekran parlaması */
        #screenFlash { position: fixed; inset: 0; pointer-events: none; z-index: 3999; opacity: 0; }

        /* Partikül patlaması */
        .burst-particle {
            position: fixed; pointer-events: none; z-index: 1300; font-size: 1.1rem;
            animation: burstFly 0.65s ease-out forwards;
        }
        @keyframes burstFly {
            0%   { opacity: 1; transform: translate(0,0) scale(1.2); }
            100% { opacity: 0; transform: translate(var(--bx),var(--by)) scale(0.2); }
        }

        /* Son 5 saniye kritik */
        .game-area.critical-time { animation: criticalPulse 0.45s ease-in-out infinite alternate !important; }
        @keyframes criticalPulse {
            from { box-shadow: 0 0 25px rgba(255,0,0,0.35) inset; border-color: rgba(255,80,80,0.6) !important; }
            to   { box-shadow: 0 0 70px rgba(255,0,0,0.85) inset; border-color: rgba(255,0,0,1) !important; }
        }
        @keyframes basketShake {
            0%,100% { transform: translateX(-50%); }
            20%     { transform: translateX(calc(-50% - 9px)) rotate(-6deg); }
            40%     { transform: translateX(calc(-50% + 9px)) rotate(6deg); }
            60%     { transform: translateX(calc(-50% - 6px)) rotate(-4deg); }
            80%     { transform: translateX(calc(-50% + 6px)) rotate(4deg); }
        }
        .basket.shake { animation: basketShake 0.35s ease !important; }

        /* Şans çarkı overlay */
        #luckyWheelOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; align-items: center; justify-content: center; z-index: 4600; }
        .wheel-card { background: linear-gradient(160deg, rgba(18,8,45,0.97), rgba(38,18,75,0.95)); border-radius: 28px; padding: 24px 20px; max-width: 340px; width: 90%; border: 1px solid rgba(255,180,80,0.45); text-align: center; box-shadow: 0 0 50px rgba(120,60,255,0.3); }
        .wheel-card h2 { font-size: 1.4rem; font-weight: 900; background: linear-gradient(135deg,#ffdd77,#ff8c42); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom: 4px; }
        .wheel-card p { font-size: 0.78rem; color: rgba(255,200,120,0.7); margin-bottom: 14px; }
        #wheelResult { font-size: 1.05rem; font-weight: bold; color: #ffdd77; min-height: 1.6rem; margin: 12px 0 6px; }
        .wheel-spin-btn { background: linear-gradient(135deg,#ff8c00,#ff4400); border: none; border-radius: 40px; padding: 13px 32px; font-size: 1rem; font-weight: 900; color: white; cursor: pointer; box-shadow: 0 5px 0 #b83000, 0 0 20px rgba(255,100,0,0.4); margin-top: 8px; }
        .wheel-spin-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b83000; }
        .wheel-spin-btn:disabled { opacity: 0.5; cursor: default; }

        /* ===== SANDIK SİSTEMİ ===== */
        .chest-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.94); display: flex; align-items: center; justify-content: center; z-index: 4800; }
        .chest-card { background: linear-gradient(160deg, rgba(25,15,60,0.98), rgba(45,25,90,0.96)); border-radius: 32px; padding: 30px 24px; max-width: 360px; width: 90%; border: 2px solid rgba(255,180,80,0.5); text-align: center; box-shadow: 0 0 60px rgba(120,60,255,0.4); }

    var currentLang = (function() {
        var saved = localStorage.getItem('pofuduk_lang');
        if (saved === 'tr' || saved === 'en') return saved;
        var dev = (navigator.language || 'tr').toLowerCase();
        return dev.indexOf('tr') === 0 ? 'tr' : 'en';
    })();
    function t(key) { var d = I18N[currentLang] || I18N.tr; return (d[key] !== undefined) ? d[key] : (I18N.tr[key] !== undefined ? I18N.tr[key] : key); }
    // Satır içi iki dilli metin (kedi konuşmaları vb. için)
    function L(tr, en) { return currentLang === 'en' ? en : tr; }
    function setLang(lang) {
        currentLang = (lang === 'en') ? 'en' : 'tr';
        localStorage.setItem('pofuduk_lang', currentLang);
        document.documentElement.lang = currentLang; // CSS uppercase'in doğru dil kurallarını kullanması için

    // ===== AYARLAR PANELİ (tüm yüzen kontroller burada toplandı) =====
    window.showSettings = function() {
        if (document.getElementById('settingsOverlay')) return;
        var inGame = (typeof gameStarted !== 'undefined') && gameStarted;
        var row = function(id, label, val) {
            return '<div class="settings-row" data-act="' + id + '"><span>' + label + '</span><span class="settings-val">' + (val || '') + '</span></div>';
        };
        var ov = document.createElement('div');
        ov.className = 'settings-overlay';
        ov.id = 'settingsOverlay';
        ov.innerHTML =
            '<div class="settings-sheet">' +
                '<div class="settings-title">' + t('settings_title') + '</div>' +
                row('sound', t('s_sound'), soundEnabled ? t('on') : t('off')) +
                row('music', t('s_music'), musicEnabled ? t('on') : t('off')) +
                row('voice', t('s_voice'), voiceEnabled ? t('on') : t('off')) +
                row('lang',  t('s_lang'),  currentLang === 'tr' ? 'Türkçe' : 'English') +
                row('privacy', t('s_privacy'), '›') +
                (privacyOptionsRequired ? row('ads', t('s_ads'), '›') : '') +
                (inGame ? '<div class="settings-row settings-danger" data-act="exit"><span>' + t('s_exit') + '</span><span class="settings-val settings-danger">›</span></div>' : '') +
                '<button class="settings-close" data-act="close">' + t('close') + '</button>' +
            '</div>';
        document.body.appendChild(ov);
        document.body.classList.add('modal-open');

        ov.addEventListener('click', function(e) {
            if (e.target === ov) { closeSettings(); return; }
            var el = e.target.closest('[data-act]');
            if (!el) return;
            var act = el.getAttribute('data-act');
            if (act === 'close') { closeSettings(); }
            else if (act === 'sound') { soundEnabled = !soundEnabled; if (soundEnabled) playBeep(); refreshSettings(); }
            else if (act === 'music') { musicEnabled = !musicEnabled; if (musicEnabled) startGameMusic(); else stopMusic(); refreshSettings(); }
            else if (act === 'voice') {
                voiceEnabled = !voiceEnabled;
                localStorage.setItem('pofuduk_voice', voiceEnabled ? '1' : '0');
                if (!voiceEnabled) { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(err) {} }
                refreshSettings();
            }
            else if (act === 'lang') { setLang(currentLang === 'tr' ? 'en' : 'tr'); }
            else if (act === 'privacy') { window.open('https://mecinar27.github.io/privacy-policy.html', '_blank'); }
            else if (act === 'ads') { closeSettings(); showPrivacyOptions(); }
            else if (act === 'exit') { closeSettings(); confirmExitToMenu(); }
        });
    };
    function refreshSettings() { var o = document.getElementById('settingsOverlay'); if (o) { o.remove(); document.body.classList.remove('modal-open'); showSettings(); } }
    window.closeSettings = function() {
        var o = document.getElementById('settingsOverlay');
        if (o) o.remove();
        document.body.classList.remove('modal-open');
    };

    // ===== SPLASH CANVAS ANİMASYONU =====
    (function() {
        var canvas = document.getElementById('splash-canvas');
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var W, H, particles = [], raf;

        function resize() {
            W = canvas.width  = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Marka ile tutarlı: yalnızca yıldız/parıltı (karışık emoji yağmuru kaldırıldı)
        var EMOJIS = ['⭐','✨','·','⭐','✦','·'];
        for (var i = 0; i < 55; i++) {
            particles.push({
                x: Math.random() * 1,   // 0-1 normalised
                y: Math.random() * 1,
                size: 8 + Math.random() * 13,
                speed: 0.00015 + Math.random() * 0.0003,
                drift: (Math.random() - 0.5) * 0.0002,
                emoji: EMOJIS[Math.floor(Math.random() * EMOJIS.length)],
                alpha: 0.35 + Math.random() * 0.5,
                rot: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.015
            });
        }

        // Akan ışık çizgileri
        var lines = [];
        for (var j = 0; j < 12; j++) {
            lines.push({
                x: Math.random(), y: Math.random(),
                len: 0.04 + Math.random() * 0.1,
                angle: Math.PI * 0.25 + (Math.random() - 0.5) * 0.4,
                speed: 0.0004 + Math.random() * 0.0006,
                alpha: 0.08 + Math.random() * 0.18,
                hue: Math.floor(Math.random() * 60) + 30
            });
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Zemin CSS'ten geliyor; kanvas yalnızca parçacıkları çizer.

            // Akan çizgiler
            lines.forEach(function(l) {
                l.x += Math.cos(l.angle) * l.speed;
                l.y += Math.sin(l.angle) * l.speed;
                if (l.x > 1.1 || l.y > 1.1) { l.x = Math.random() * 0.3; l.y = Math.random() * 0.8; }
                ctx.save();
                ctx.globalAlpha = l.alpha;
                ctx.strokeStyle = 'hsl(' + l.hue + ',100%,75%)';
                ctx.lineWidth = 1.5;
                ctx.lineCap = 'round';
                ctx.shadowColor = 'hsl(' + l.hue + ',100%,60%)';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.moveTo(l.x * W, l.y * H);
                ctx.lineTo((l.x + Math.cos(l.angle) * l.len) * W, (l.y + Math.sin(l.angle) * l.len) * H);
                ctx.stroke();
                ctx.restore();
            });

            // Emoji partiküller
            particles.forEach(function(p) {
                p.y -= p.speed;
                p.x += p.drift;
                p.rot += p.rotSpeed;
                if (p.y < -0.05) { p.y = 1.05; p.x = Math.random(); }
                if (p.x < -0.05) p.x = 1.05;
                if (p.x > 1.05)  p.x = -0.05;
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.translate(p.x * W, p.y * H);
                ctx.rotate(p.rot);
                ctx.font = p.size + 'px serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.emoji, 0, 0);
                ctx.restore();
            });

            raf = requestAnimationFrame(draw);
        }
        draw();

        // Oyun başlayınca canvas'ı durdur
        window._stopSplashCanvas = function() {
            if (raf) cancelAnimationFrame(raf);
            window.removeEventListener('resize', resize);
        };
    })();

    // Three.js Setup
    let scene, camera, renderer, starField, particles = [];
    
    function initThreeJS() {
        if (typeof THREE === 'undefined') return; // three.js yüklenmediyse arka plan 3D atlanır, oyun çalışmaya devam eder
        const canvas = document.getElementById('three-canvas');
        const container = document.getElementById('gameArea');
        if (!canvas || !container) return;

        const width = container.offsetWidth;
        const height = container.offsetHeight;
        
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
        camera.position.z = 50;
        
        renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(width, height);
        
        // Star field
        const geometry = new THREE.BufferGeometry();
        const vertices = [];
        const colors = [];
        
        for (let i = 0; i < 150; i++) {
            vertices.push((Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100, (Math.random() - 0.5) * 50);
            const color = new THREE.Color();
            color.setHSL(Math.random() * 0.2 + 0.5, 1, 0.8);
            colors.push(color.r, color.g, color.b);
        }
        
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        
        const material = new THREE.PointsMaterial({ size: 0.5, vertexColors: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
        starField = new THREE.Points(geometry, material);
        scene.add(starField);
        
        // Ambient particles
        for (let i = 0; i < 20; i++) {
            const pGeo = new THREE.SphereGeometry(0.3, 8, 8);
            const pMat = new THREE.MeshBasicMaterial({ color: 0xffdd77, transparent: true, opacity: 0.6 });
            const mesh = new THREE.Mesh(pGeo, pMat);
            mesh.position.set((Math.random() - 0.5) * 80, (Math.random() - 0.5) * 60, (Math.random() - 0.5) * 30);
            particles.push({ mesh: mesh, vx: (Math.random() - 0.5) * 0.2, vy: Math.random() * 0.1 + 0.05 });
            scene.add(mesh);
        }
        
        animate();
    }
    
    function animate() {
        if (!renderer) return;
        requestAnimationFrame(animate);
        
        if (starField) {
            starField.rotation.y += 0.0005;
            starField.rotation.x += 0.0002;
        }
        
        particles.forEach(p => {
            p.mesh.position.y += p.vy;
            p.mesh.position.x += p.vx;
            if (p.mesh.position.y > 50) {
                p.mesh.position.y = -50;
                p.mesh.position.x = (Math.random() - 0.5) * 80;
            }
        });
        
        renderer.render(scene, camera);
    }

    // Audio
    let soundEnabled = true, musicEnabled = true, audioCtx = null, musicNodes = [], musicPlaying = false;
    // Sesli anlatım (TTS) varsayılan KAPALI — kullanıcı isterse açar
    let voiceEnabled = localStorage.getItem('pofuduk_voice') === '1';
    
    function getAudioCtx() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }
    
    function unlockAudio() {
        try {
            const ctx = getAudioCtx();
            const buffer = ctx.createBuffer(1, 1, 22050);
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            source.connect(ctx.destination);
            source.start(0);
        } catch(e) {}
    }
    
    function playPop(combo) {
        if (!soundEnabled) return;
        try {
            const ctx = getAudioCtx();
            const t = ctx.currentTime;
            const pitch = 440 + Math.min(combo || 0, 20) * 30;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(pitch, t);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.1);
        } catch(e) {}
    }
    
    function playFanfare() {
        if (!soundEnabled) return;
        try {
            const ctx = getAudioCtx();
            const t = ctx.currentTime;
            [523, 659, 784, 1047].forEach((f, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.value = f;
                gain.gain.setValueAtTime(0, t + i * 0.15);
                gain.gain.linearRampToValueAtTime(0.2, t + i * 0.15 + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.15 + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t + i * 0.15);
                osc.stop(t + i * 0.15 + 0.35);
            });
        } catch(e) {}
    }
    
    function playPuzzleSound() {
        if (!soundEnabled) return;
        try {
            const ctx = getAudioCtx();
            const t = ctx.currentTime;
            [262, 330, 392, 523, 659, 784, 1047, 1319].forEach((f, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.value = f;
                gain.gain.setValueAtTime(0, t + i * 0.08);
                gain.gain.linearRampToValueAtTime(0.15, t + i * 0.08 + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t + i * 0.08);
                osc.stop(t + i * 0.08 + 0.45);
            });
        } catch(e) {}
    }
    
    function playBeep() {
        if (!soundEnabled) return;
        try {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.value = 880;
            gain.gain.value = 0.1;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.15);
            osc.stop(ctx.currentTime + 0.15);
        } catch(e) {}
    }
    
    function stopMusic() {
        musicPlaying = false;
        musicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
        musicNodes = [];
    }
    
    function startGameMusic() {
        if (!musicEnabled) return;
        stopMusic();
        musicPlaying = true;
        try {
            const ctx = getAudioCtx();
            const notes = [523, 587, 659, 698, 784, 698, 659, 587];
            const dur = 0.3;
            let time = ctx.currentTime + 0.1;
            
            function loop() {
                if (!musicEnabled || !musicPlaying) return;
                notes.forEach((f, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = f;
                    gain.gain.setValueAtTime(0, time + i * dur);
                    gain.gain.linearRampToValueAtTime(0.05, time + i * dur + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + i * dur + dur - 0.05);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(time + i * dur);
                    osc.stop(time + i * dur + dur);
                    musicNodes.push(osc);
                });
                time += notes.length * dur;
                setTimeout(loop, notes.length * dur * 1000 - 200);
            }
            loop();
        } catch(e) {}
    }
    
    function playGameOverMusic() {
        if (!musicEnabled) return;
        stopMusic();
        try {
            const ctx = getAudioCtx();
            const t = ctx.currentTime;
            [392, 349, 330, 294, 262, 247, 220].forEach((f, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = f;
                gain.gain.setValueAtTime(0, t + i * 0.4);
                gain.gain.linearRampToValueAtTime(0.1, t + i * 0.4 + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.4 + 0.35);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t + i * 0.4);
                osc.stop(t + i * 0.4 + 0.4);
                musicNodes.push(osc);
            });
        } catch(e) {}
    }

    function playTickSound() {
        if (!soundEnabled) return;
        try {
            var ctx = getAudioCtx();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'square';
            osc.frequency.value = 220;
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.08);
        } catch(e) {}
    }

    function startStarRain(duration) {
        const canvas = document.getElementById('celebCanvas');
        if (!canvas) return;
        const area = document.getElementById('gameArea');
        canvas.width = area.offsetWidth || 400;
        canvas.height = area.offsetHeight || 600;
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;
        const emojis = ['⭐', '🌟', '✨', '💫', '🎉'];
        const stars = [];
        for (let i = 0; i < 50; i++) {
            stars.push({
                x: Math.random() * W,
                y: -40 - Math.random() * 300,
                vy: 3 + Math.random() * 4,
                vx: (Math.random() - 0.5) * 3,
                rot: Math.random() * Math.PI * 2,
                rotV: (Math.random() - 0.5) * 0.15,
                size: 18 + Math.random() * 25,
                emoji: emojis[Math.floor(Math.random() * emojis.length)],
                alpha: 1
            });
        }
        const start = Date.now();
        if (celebRAF) cancelAnimationFrame(celebRAF);
        
        function draw() {
            const elapsed = Date.now() - start;
            ctx.clearRect(0, 0, W, H);
            stars.forEach(s => {
                s.y += s.vy;
                s.x += s.vx;
                s.rot += s.rotV;
                s.alpha = elapsed < duration * 0.7 ? 1 : Math.max(0, 1 - (elapsed - duration * 0.7) / (duration * 0.3));
                if (s.y > H + 30) s.y = -30;
                ctx.save();
                ctx.globalAlpha = s.alpha;
                ctx.translate(s.x, s.y);
                ctx.rotate(s.rot);
                ctx.font = s.size + 'px serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(s.emoji, 0, 0);
                ctx.restore();
            });
            if (elapsed < duration) celebRAF = requestAnimationFrame(draw);
            else { ctx.clearRect(0, 0, W, H); celebRAF = null; }
        }
        draw();
    }
    
    function startConfetti(duration) {
        const canvas = document.getElementById('celebCanvas');
        if (!canvas) return;
        const area = document.getElementById('gameArea');
        canvas.width = area.offsetWidth || 400;
        canvas.height = area.offsetHeight || 600;
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;
        const colors = ['#ff4444', '#44ff44', '#4488ff', '#ffff44', '#ff44ff', '#44ffff'];
        const pieces = [];
        for (let i = 0; i < 60; i++) {
            pieces.push({
                x: Math.random() * W,
                y: -30 - Math.random() * 400,
                vy: 2 + Math.random() * 3,
                vx: (Math.random() - 0.5) * 4,
                w: 6 + Math.random() * 10,
                h: 4 + Math.random() * 6,
                rot: Math.random() * Math.PI * 2,
                rotV: (Math.random() - 0.5) * 0.1,
                color: colors[Math.floor(Math.random() * colors.length)],
                alpha: 1
            });
        }
        const start = Date.now();
        if (celebRAF) cancelAnimationFrame(celebRAF);
        
        function draw() {
            const elapsed = Date.now() - start;
            ctx.clearRect(0, 0, W, H);
            pieces.forEach(p => {
                p.y += p.vy;
                p.x += p.vx;
                p.rot += p.rotV;
                p.alpha = elapsed < duration * 0.65 ? 1 : Math.max(0, 1 - (elapsed - duration * 0.65) / (duration * 0.35));
                if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();
            });
            if (elapsed < duration) celebRAF = requestAnimationFrame(draw);
            else { ctx.clearRect(0, 0, W, H); celebRAF = null; }
        }
        draw();
    }

    const LEVEL_BG_MAP = [0, 1, 1, 2, 2, 0, 4, 1, 3, 2, 0, 1, 1, 1, 0, 0, 0, 3, 4, 3, 0, 0, 3, 0, 2, 2, 2, 1, 0, 0, 1, 4, 0, 1, 2, 3, 0, 1, 3, 0];
    
    function drawBackground(levelIndex) {
        const canvas = document.getElementById('gameBgCanvas');
        if (!canvas) return;
        const area = document.getElementById('gameArea');
        canvas.width = area.offsetWidth || 400;
        canvas.height = area.offsetHeight || 600;
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;
        ctx.clearRect(0, 0, W, H);
        
        const scenes = [
            function(c, W, H) {
                const g = c.createLinearGradient(0, 0, 0, H);
                g.addColorStop(0, '#0a0a1a');
                g.addColorStop(1, '#1a1a3a');
                c.fillStyle = g;
                c.fillRect(0, 0, W, H);
                for (let i = 0; i < 50; i++) {
                    c.beginPath();
                    c.arc((i * 97 + 13) % W, (i * 53 + 7) % (H * 0.7), i % 3 == 0 ? 2 : 1, 0, Math.PI * 2);
                    c.fillStyle = 'rgba(255,255,255,' + (0.3 + i % 5 * 0.12) + ')';
                    c.fill();
                }
                c.beginPath();
                c.arc(W * 0.85, H * 0.12, 45, 0, Math.PI * 2);
                c.fillStyle = '#ffffd0';
                c.fill();
                c.beginPath();
                c.arc(W * 0.9, H * 0.08, 35, 0, Math.PI * 2);
                c.fillStyle = '#1a1a3a';
                c.fill();
            },
            function(c, W, H) {
                const g = c.createLinearGradient(0, 0, 0, H);
                g.addColorStop(0, '#4ab8f8');
                g.addColorStop(0.5, '#87CEEB');
                g.addColorStop(0.8, '#b8e896');
                g.addColorStop(1, '#4a9428');
                c.fillStyle = g;
                c.fillRect(0, 0, W, H);
                c.beginPath();
                c.arc(W * 0.88, H * 0.12, 50, 0, Math.PI * 2);
                c.fillStyle = '#FFE040';
                c.fill();
            },
            function(c, W, H) {
                const g = c.createLinearGradient(0, 0, 0, H);
                g.addColorStop(0, '#ff6b6b');
                g.addColorStop(0.4, '#ffa500');
                g.addColorStop(0.7, '#ff69b4');
                g.addColorStop(1, '#4a2040');
                c.fillStyle = g;
                c.fillRect(0, 0, W, H);
                c.beginPath();
                c.arc(W * 0.5, H * 0.45, 60, 0, Math.PI * 2);
                c.fillStyle = '#ff4400';
                c.fill();
            },
            function(c, W, H) {
                c.fillStyle = '#000008';
                c.fillRect(0, 0, W, H);
                for (let i = 0; i < 80; i++) {
                    c.beginPath();
                    c.arc(Math.random() * W, Math.random() * H * 0.8, Math.random() * 1.5, 0, Math.PI * 2);
                    c.fillStyle = 'hsla(' + (Math.random() * 60 + 200) + ',100%,80%,' + (Math.random() * 0.5 + 0.5) + ')';
                    c.fill();
                }
            },
            function(c, W, H) {
                const g = c.createLinearGradient(0, 0, 0, H);
                g.addColorStop(0, '#003d5c');
                g.addColorStop(0.5, '#0066aa');
                g.addColorStop(1, '#0088cc');
                c.fillStyle = g;
                c.fillRect(0, 0, W, H);
            }
        ];
        
        const sceneIndex = LEVEL_BG_MAP[levelIndex] || 0;
        if (scenes[sceneIndex]) scenes[sceneIndex](ctx, W, H);
    }

    function showGameToast(message) {

    }

    function catSpeakWithVoice(message) {
        showGameToast(message);
        if (!soundEnabled) return;
        const cleanMsg = cleanTextForSpeech(message);
        if (!cleanMsg) return;
        // Sesli anlatım varsayılan olarak KAPALI (opt-in). Tiz "çizgi film" sesi
        // yerine nötr ton kullanılır — genel kitle (13+) konumlandırmasıyla uyumlu.
        if (!voiceEnabled) return;
        var ttsLang = (currentLang === 'en') ? 'en-US' : 'tr-TR';
        try {
            if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                const tts = window.Capacitor.Plugins.TextToSpeech;
                if (tts) {
                    tts.stop();
                    tts.speak({ text: cleanMsg, lang: ttsLang, rate: 1.35, pitch: 1.05, volume: 0.9 });
                    return;
                }
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                var u = new SpeechSynthesisUtterance(cleanMsg);
                u.lang = ttsLang;
                u.rate = 1.35;
                u.pitch = 1.05;
                u.volume = 0.9;
                window.speechSynthesis.speak(u);
            }
        } catch(e) {}
    }

        overlay.appendChild(content);

        function update() {
            if (count > 0) {
                content.innerHTML = '<div class="countdown-number">' + count + '</div><div style="color:white;font-size:1.4rem;margin-top:10px;">Hazır mısın?</div>';
                playBeep();
                count--;
                setTimeout(update, 1000);
            } else {
                content.innerHTML = '<div style="font-size:4rem;font-weight:bold;color:#ffdd77;text-shadow:0 0 50px #ffaa44;">BAŞLA!</div>';
                playBeep();
                setTimeout(function() { overlay.remove(); if (callback) callback(); }, 800);
            }
        }
        update();
    }

        else if (i <= 35) { target = 635 + (i - 31) * 40; time = 33; speed = 600; }
        else              { target = 835 + (i - 36) * 50; time = 31; speed = 550; }
        THEMES.push({ id: i, name: themeNames[i - 1], nameEN: themeNamesEN[i - 1], icon: themeIcons[i - 1], items: themeItems[i - 1], target: target, timeLimit: time, speed: speed, basketIcon: '🧺' });

    // ---- BOSS MÜZİK ----
    function startBossMusic() {
        if (!musicEnabled) return;
        stopMusic();
        try {
            var ctx = getAudioCtx();
            var t = ctx.currentTime;
            var pattern = [110, 0, 165, 0, 110, 0, 220, 0, 88, 0, 88, 0, 165, 220];
            pattern.forEach(function(freq, i) {
                if (!freq) return;
                var osc = ctx.createOscillator();
                var gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, t + i * 0.17);
                gain.gain.linearRampToValueAtTime(0.1, t + i * 0.17 + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.17 + 0.15);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(t + i * 0.17); osc.stop(t + i * 0.17 + 0.17);
                musicNodes.push(osc);
            });
        } catch(e) {}
    }

    function spawnPowerUp() {
        if (!gameActive || isLevelCompleteScreen || isGameOverScreen || isPaused) return;
        var areaRect = dom.gameArea.getBoundingClientRect();
        if (areaRect.width === 0) return;
        var pu = POWER_UP_TYPES[Math.floor(Math.random() * POWER_UP_TYPES.length)];
        var item = document.createElement('div');
        item.id = 'item' + itemId++;
        item.className = 'floating-item power-up';
        item.dataset.powerUp = pu.id;
        item.innerHTML = pu.icon;
        item.style.filter = 'drop-shadow(0 0 16px ' + pu.color + ')';
        var sx = Math.random() * (areaRect.width - 80) + 15;
        var sy = Math.random() * (areaRect.height - 150) + 20;
        item.style.left = sx + 'px'; item.style.top = sy + 'px';
        item.dataset.vx = '0'; item.dataset.vy = '0';
        item.dataset.px = sx.toFixed(1); item.dataset.py = sy.toFixed(1);
        item.onclick = function(e) {
            e.stopPropagation();
            var rect = item.getBoundingClientRect();
            collectItem(item, rect.left + 25, rect.top + 25, pu.icon);
        };
        dom.gameArea.appendChild(item);
        itemsArray.push(item);
        setTimeout(function() {
            if (item.parentNode) { item.classList.add('fading'); setTimeout(function() { removeItem(item); }, 400); }
        }, 9000);
    }
    function startPowerUpInterval() {

    // ---- GERÇEK SATIN ALMA (Google Play Billing / cordova-plugin-purchase) ----
    // Play Console'da tanımlanması gereken ürün kimlikleri:
    var IAP_IDS = {
        starter:   'pofuduk_starter_pack',   // Tek seferlik (non-consumable)
        vip:       'pofuduk_vip_monthly',    // Aylık abonelik

    function iapKeyFromStoreId(storeId) {
        for (var k in IAP_IDS) { if (IAP_IDS[k] === storeId) return k; }

    // Ödül verme — hem gerçek satın alma hem simülasyon bu tek fonksiyonu kullanır
    function grantProduct(productId) {
        if (productId === 'starter') {
            applyVIPPurchase(1);

        } else if (productId === 'vip' || productId === 'vip_extend') {
            applyVIPPurchase(1);
            showPurchaseSuccess(L('💎 VIP Aktif!','💎 VIP Active!'), L('30 gün VIP üyeliğin başladı. Her gün 50 ⭐ kazan!','Your 30-day VIP has started. Earn 50 ⭐ every day!'));
        } else if (productId === 'vip_yearly') {

        } else if (productId === 'small')  { addStars(100);  showPurchaseSuccess(L('⭐ 100 Yıldız!','⭐ 100 Stars!'), L('Hesabına 100 yıldız para eklendi.','100 star coins were added to your account.')); }

    function initIAP() {
        if (!window.CdvPurchase || !window.CdvPurchase.store) return; // Web/gelistirme ortamı — simülasyon devrede kalır
        try {
            var store = CdvPurchase.store;
            var PT = CdvPurchase.ProductType;
            var GP = CdvPurchase.Platform.GOOGLE_PLAY;
            store.register([
                { id: IAP_IDS.vip,        type: PT.PAID_SUBSCRIPTION, platform: GP },
                { id: IAP_IDS.vip_yearly, type: PT.PAID_SUBSCRIPTION, platform: GP },
                { id: IAP_IDS.starter,    type: PT.NON_CONSUMABLE,    platform: GP },
                { id: IAP_IDS.small,      type: PT.CONSUMABLE,        platform: GP },
                { id: IAP_IDS.medium,     type: PT.CONSUMABLE,        platform: GP },
                { id: IAP_IDS.mega,       type: PT.CONSUMABLE,        platform: GP }
            ]);
            store.when().approved(function(tx) {
                // Aynı işlemin iki kez ödül vermesini engelle
                var granted = [];
                try { granted = JSON.parse(localStorage.getItem('pofuduk_granted_tx') || '[]'); } catch(e) {}
                if (tx.transactionId && granted.indexOf(tx.transactionId) !== -1) { tx.finish(); return; }
                tx.products.forEach(function(p) {
                    var key = iapKeyFromStoreId(p.id);
                    if (key) grantProduct(key);
                });
                if (tx.transactionId) {
                    granted.push(tx.transactionId);
                    if (granted.length > 100) granted = granted.slice(-100);
                    localStorage.setItem('pofuduk_granted_tx', JSON.stringify(granted));
                }
                tx.finish();
            });
            store.initialize([GP]).then(function() { iapReady = true; });
        } catch(e) { /* IAP başlatılamadı — simülasyon devrede */ }
    }

    // Google Play politikası: kullanıcı satın alımlarını geri yükleyebilmeli
